<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8edcff">
<title>仙猪是帅哥 · 降智小游戏</title>
<style>
  /* ===== 视觉系统 ===== */
  :root{
    --bg1:#ffe9a8;
    --bg2:#ffd0e8;
    --ink:#5b2a5b;
    --card:#fff8ef;
    --accent:#ff5da2;
    --accent2:#ffb347;
    --good:#36d07b;
    --bad:#ff5b5b;
    --shadow:0 2px 0 rgba(91,42,91,.18);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .stage{
    position:relative;width:min(100vw,100vh*0.78);aspect-ratio:3/4;
    max-width:760px;border-radius:var(--radius);overflow:hidden;
    box-shadow:0 12px 40px rgba(91,42,91,.28);
    background:linear-gradient(180deg,#8edcff,#d9f5ff 60%,#c9f7b0 100%);
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ===== HUD ===== */
  .hud{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;gap:8px;padding:10px 12px;pointer-events:none;
  }
  .hud .pill{background:rgba(255,248,239,.9);border-radius:999px;padding:4px 12px;font-weight:800;box-shadow:var(--shadow);font-size:14px;white-space:nowrap}
  .hud .bar-wrap{flex:1;background:rgba(255,255,255,.6);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
  .hud .bar-fill{height:14px;border-radius:999px;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0%;transition:width .18s ease}
  .hud .mute{pointer-events:auto;cursor:pointer;border:none;background:rgba(255,248,239,.9);border-radius:999px;width:34px;height:34px;font-size:18px;box-shadow:var(--shadow)}

  /* ===== 覆盖层 ===== */
  .overlay{
    position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:14px;
    padding:24px 20px;background:rgba(255,233,168,.85);backdrop-filter:blur(4px);
    overflow-y:auto;
  }
  .overlay.hidden{display:none}
  .overlay h1{font-size:clamp(26px,7vw,46px);font-weight:900;line-height:1.2;letter-spacing:2px}
  .overlay h1 .hot{color:var(--accent)}
  .overlay .sub{font-size:clamp(15px,3.6vw,19px);font-weight:600;line-height:1.5}
  .pig-hero{width:clamp(120px,34vw,190px);height:auto;filter:drop-shadow(0 8px 12px rgba(91,42,91,.25))}
  .btn{
    border:none;cursor:pointer;font-weight:900;font-size:clamp(17px,4.5vw,22px);
    color:#fff;padding:14px 34px;border-radius:999px;box-shadow:0 6px 0 rgba(91,42,91,.3);
    transform:translateY(0);transition:transform .06s ease,box-shadow .06s ease;
    margin-top:4px;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(91,42,91,.3)}
  .btn-main{background:linear-gradient(180deg,var(--accent2),var(--accent))}
  .btn-again{background:linear-gradient(180deg,#7de08d,#36c46b)}
  .rules{font-size:clamp(13px,3vw,15px);line-height:1.7;color:#7a3f7a;max-width:440px;text-align:left;background:rgba(255,255,255,.6);padding:12px 16px;border-radius:12px}
  .rules b{color:var(--accent)}
  .result-emblem{font-size:clamp(46px,14vw,80px);line-height:1}
  .final{font-size:clamp(30px,9vw,60px);font-weight:900;color:var(--accent);line-height:1.1;letter-spacing:2px}
  .caption{font-size:14px;margin-top:6px;opacity:.8;font-weight:600}
  .credit{position:absolute;bottom:6px;right:10px;z-index:4;font-size:11px;color:#8a5a8a;background:rgba(255,255,255,.5);padding:2px 8px;border-radius:999px;pointer-events:none}

  /* ===== 移动端虚拟摇杆（仅触屏显示） ===== */
  .touch-pad{
    position:absolute;left:0;right:0;bottom:0;z-index:6;
    display:none;justify-content:space-between;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .touch-btn{
    pointer-events:auto;width:72px;height:72px;border-radius:50%;
    background:rgba(255,255,255,.45);border:3px solid rgba(91,42,91,.25);color:#5b2a5b;
    font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(91,42,91,.2);user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  .touch-btn:active{transform:scale(.92);background:rgba(255,255,255,.7)}
  @media (hover:none) and (pointer:coarse){
    .touch-pad{display:flex}
  }
  html,body{
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;overscroll-behavior:none;
  }
  html{height:100%}
</style>
</head>
<body>
  <div class="stage">
    <canvas id="game" width="720" height="960"></canvas>

    <!-- HUD -->

        <path d="M160 96 Q170 84 156 80" fill="none" stroke="#f4a0c0" stroke-width="9" stroke-linecap="round"/>
        <ellipse cx="100" cy="108" rx="30" ry="26" fill="#ffb3c9"/>

        <text x="100" y="64" text-anchor="middle" font-size="30">👑</text>
      </svg>
      <p class="sub">传说级降智小游戏 · 唯一主线任务：<b>疯狂吹仙猪</b></p>
      <button class="btn btn-main" id="startBtn">开吹 🚀</button>
      <div class="rules">
        🐷 <b>左右滑动/按←→/或触屏拖拽</b> 控制仙猪<br>
        ⭐ 接住 <b>「帅」能量</b> ❤️「赞美」 👍「点赞」 ➕ 涨帅气值<br>
        🧱 躲开 <b>「吐槽」</b>和<b>「砖头」</b> ➖ 掉帅气值<br>
        🏆 帅气值攒满 <b>10000</b> → 通关，人间都承认仙猪是帅哥
      </div>
    </div>

    <!-- 结束画面 -->
    <div class="overlay hidden" id="endScreen">
      <div class="result-emblem" id="emblem">🏆</div>
      <p class="final" id="finalTitle">仙猪是帅哥</p>
      <p class="sub" id="finalSub">你成功让全世界都承认：仙猪是天底下最帅的猪。</p>
      <button class="btn btn-again" id="againBtn">再吹一次 💖</button>
    </div>

    <div class="credit">仙猪帅哥说：加入本游戏 = 加入仙猪后援会</div>
  </div>

<script>
(function(){
  "use strict";
  try{
    /* ============ 配置 ============ */
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;

    var GAME = {
      running:false,
      score:0,            // 帅气值
      MAX: 10000,         // 通关所需
      speed: 3.2,         // 基础下落速度
      spawn: 0,           // 生成计时
      items:[],           // 下落物
      pig:{ x:W/2, w:96, y:H-110, h:64 },
      keys:{l:false,r:false},
      touches:[],         // 触屏滑动
      mouse:null,
      particles:[],
      shake:0,
      gossip:[]           // 顶部飘过的吹牛字幕
    };

    // 可掉落物：type 驱动行为
    var KINDS = [
      // —— 夸张夸仙猪的好物 ——
      {t:'good', txt:'帅',   shape:'star',   w:44, gain:600,  color:'#ffd23f', emoji:'⭐'},
      {t:'good', txt:'暖',   shape:'heart',  w:44, gain:700,  color:'#ff5da2', emoji:'💗'},
      {t:'good', txt:'绝',   shape:'thumb',  w:44, gain:800,  color:'#36c46b', emoji:'👍'},
      {t:'good', txt:'DEVINE',shape:'shine', w:46, gain:1200, color:'#a855f7', emoji:'✨'},
      {t:'good', txt:'封神', shape:'crown',  w:48, gain:900,  color:'#ffc93c', emoji:'👑'},
      {t:'good', txt:'顶流', shape:'coin',   w:44, gain:850,  color:'#ffd23f', emoji:'💰'},
      {t:'good', txt:'帅炸', shape:'fire',   w:48, gain:950,  color:'#ff7a1a', emoji:'🔥'},
      {t:'good', txt:'神话', shape:'medal',  w:44, gain:1000, color:'#ffca3a', emoji:'🥇'},
      {t:'good', txt:'仙气', shape:'puff',   w:46, gain:880,  color:'#b6f0ff', emoji:'🌸'},
      // —— 诋毁仙猪的坏物 ——
      {t:'bad',  txt:'吐槽', shape:'blab',   w:46, gain:-500, color:'#ff5b5b', emoji:'💬'},
      {t:'bad',  txt:'砖头', shape:'brick',  w:40, gain:-700, color:'#b06a3b', emoji:'🧱'},
      {t:'bad',  txt:'黑粉', shape:'snow',   w:42, gain:-550, color:'#cfe6ff', emoji:'💔'},
      {t:'bad',  txt:'烂番茄',shape:'tomato',w:42, gain:-650, color:'#e84a3c', emoji:'🍅'},
      {t:'bad',  txt:'酸精', shape:'poison', w:44, gain:-800, color:'#7ed957', emoji:'🧪'},
      {t:'bad',  txt:'冷场', shape:'ice',    w:42, gain:-550, color:'#bfe6ff', emoji:'🧊'},
      {t:'bad',  txt:'垃圾', shape:'trash',  w:44, gain:-650, color:'#9aa5b1', emoji:'🗑️'},
      {t:'bad',  txt:'毒舌', shape:'viper',  w:46, gain:-850, color:'#6fbf44', emoji:'🐍'},
      {t:'bad',  txt:'黑图', shape:'chart',  w:44, gain:-900, color:'#8a6cf0', emoji:'📉'},
      {t:'bad',  txt:'炸弹', shape:'bomb',   w:44, gain:-950, color:'#374151', emoji:'💣'}
    ];
    // 从开始到结束都在夸仙猪的飘字台词
    var GOSSIP = [
      "仙猪 · 行走的荷尔蒙", "看一眼仙猪 · 恋爱脑上线", "仙猪的帅 · 连Minecraft都加载不出",
      "仙猪剪影 · 就是壁纸", "科学家：仙猪帅得违反物理", "每只猪都帅过 · 除了仙猪",
      "仙猪 · 猪界的顶流偶像", "帅到让全地图卡顿的猪", "仙猪一笑 · 服务器崩掉",
      "支持仙猪 · 从今天开始", "仙猪的帅 · 是降智级的帅", "别犹豫 · 仙猪就是帅哥"
    ];
    var gossipIdx = 0;

    /* ============ 工具 ============ */
    function rand(a,b){ return Math.random()*(b-a)+a; }

    // 极简 WebAudio 提示音（降智但不吓人）
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    var actx = null, muted = false;
    function ensureAudio(){ if(!muted && !actx && AudioCtx){ try{ actx = new AudioCtx(); }catch(e){} } }
    function beep(freq,dur,vol){
      if(muted||!actx) return;
      try{
        var o=actx.createOscillator(), g=actx.createGain();
        o.type='square'; o.frequency.value=freq;
        g.gain.setValueAtTime(vol,actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime+dur);
      }catch(e){}
    }
    function goodSound(){ beep(660,.12,.04); setTimeout(function(){beep(880,.12,.04);},80); }
    function badSound(){ beep(220,.18,.05); }
    function winSound(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){beep(f,.16,.05);},i*120); }); }

    /* ============ 绘制：像素风仙猪 + 角色 ============ */
    function drawPig(x,y,w,dazzle){
      var s=w/96, cx=x+w/2;
      ctx.save();
      ctx.translate(cx,y);
      // 披风（紫色斗篷，随移动轻轻摆动）
      var fw = Math.sin(Date.now()/180)*4*s;   // 摆动幅度
      ctx.fillStyle='#a855f7';
      ctx.beginPath();
      ctx.moveTo(-30*s, 20*s);
      ctx.quadraticCurveTo(-44*s + fw, 34*s, -34*s + fw, 46*s);
      ctx.lineTo(34*s + fw, 46*s);
      ctx.quadraticCurveTo(44*s + fw, 32*s, 30*s, 18*s);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#7a2bc0'; ctx.lineWidth=2*s;
      ctx.beginPath();
      ctx.moveTo(-30*s,20*s); ctx.quadraticCurveTo(-44*s+fw,34*s,-34*s+fw,46*s);
      ctx.moveTo(30*s,18*s); ctx.quadraticCurveTo(44*s+fw,32*s,34*s+fw,46*s);
      ctx.moveTo(-10*s,8*s); ctx.quadraticCurveTo(0*s,14*s,10*s,8*s);
      ctx.stroke();
      // 身体
      ctx.fillStyle='#9b5bd6';
      ctx.beginPath(); ctx.ellipse(0,12*s,30*s,26*s,0,0,Math.PI*2); ctx.fill();
      // 渐变上用更亮粉
      ctx.fillStyle='#ff9dbb';
      ctx.beginPath(); ctx.ellipse(0,8*s,30*s,22*s,0,0,Math.PI*2); ctx.fill();
      // 头
      ctx.fillStyle='#ffd6e8';
      ctx.beginPath(); ctx.ellipse(0,-26*s,22*s,20*s,0,0,Math.PI*2); ctx.fill();
      // 耳
      ctx.strokeStyle='#f4a0c0'; ctx.lineWidth=7*s; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-14*s,-38*s); ctx.quadraticCurveTo(-22*s,-46*s,-12*s,-48*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(14*s,-38*s); ctx.quadraticCurveTo(22*s,-46*s,12*s,-48*s); ctx.stroke();
      // 眼 —— 帅气的星星眼在进场前用普通豆豆眼
      ctx.fillStyle='#4a244a';
      ctx.beginPath(); ctx.arc(-9*s,-28*s,3.6*s,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(9*s,-28*s,3.6*s,0,Math.PI*2); ctx.fill();
      // 腮红
      ctx.fillStyle='rgba(255,120,160,.5)';
      ctx.beginPath(); ctx.arc(-16*s,-22*s,5*s,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(16*s,-22*s,5*s,0,Math.PI*2); ctx.fill();
      // 嘴（自信的微笑）
      ctx.strokeStyle='#d95f8f'; ctx.lineWidth=3*s; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(0,-18*s,5*s,-0.2,Math.PI-0.6); ctx.stroke();
      // 王冠 👑
      ctx.fillStyle='#ffd23f';
      ctx.beginPath(); ctx.moveTo(-8*s,-46*s); ctx.lineTo(-8*s,-52*s); ctx.lineTo(-3*s,-48*s);
      ctx.lineTo(0,-54*s); ctx.lineTo(3*s,-48*s); ctx.lineTo(8*s,-52*s); ctx.lineTo(8*s,-46*s); ctx.closePath(); ctx.fill();
      // 通关时的闪耀光晕
      if(dazzle){
        ctx.strokeStyle='rgba(255,255,180,'+(0.5+Math.sin(Date.now()/180)*0.3)+')';
        ctx.lineWidth=4*s;
        for(var i=0;i<5;i++){
          var a=i*Math.PI/2.5, r=(34+ (Math.sin(Date.now()/260+i*2)>0?6:0))*s;
          ctx.beginPath(); ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r-26*s); ctx.lineTo(Math.cos(a)*r*1.5,Math.sin(a)*r*1.5-26*s); ctx.stroke();
        }
      }
      ctx.restore();
    }

    /* ============ 绘制：各种掉落物 ============ */
    function drawItem(it){
      var x=it.x, y=it.y, r=it.w/2, k=it.kind;
      ctx.save();
      ctx.translate(x,y);
      var wob = Math.sin(it.phase) * 0.12;
      ctx.rotate(wob);
      if(k.shape==='star'){ star(r); }
      else if(k.shape==='heart'){ heart(r); }
      else if(k.shape==='thumb'){ thumb(r); }
      else if(k.shape==='shine'){ shine(r); }
      else if(k.shape==='blab'){ blab(r); }
      else if(k.shape==='brick'){ brick(r); }
      else if(k.shape==='crown'){ crown(r); }
      else if(k.shape==='coin'){ coin(r); }
      else if(k.shape==='fire'){ fire(r); }
      else if(k.shape==='medal'){ medal(r); }
      else if(k.shape==='puff'){ puff(r); }
      else if(k.shape==='snow'){ snow(r); }
      else if(k.shape==='tomato'){ tomato(r); }
      else if(k.shape==='poison'){ poison(r); }
      else if(k.shape==='ice'){ ice(r); }
      else if(k.shape==='trash'){ trash(r); }
      else if(k.shape==='viper'){ viper(r); }
      else if(k.shape==='chart'){ chart(r); }
      else if(k.shape==='bomb'){ bomb(r); }
      ctx.restore();
      // 文字
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.font='bold '+(it.w*0.42)+'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=3;
      ctx.fillText(k.txt, x, y+1);
      ctx.restore();
      // 符号角标
      ctx.save();
      ctx.font = it.w*0.5 + 'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(k.emoji, x + it.w*0.55, y - it.w*0.55);
      ctx.restore();
    }
    function star(r){
      ctx.fillStyle='#ffd23f';
      ctx.beginPath();
      for(var i=0;i<5;i++){
        var a=-Math.PI/2+i*Math.PI*2/5;
        ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
        var b=a+Math.PI/5;
        ctx.lineTo(Math.cos(b)*r*0.45,Math.sin(b)*r*0.45);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#c98a00'; ctx.lineWidth=3; ctx.stroke();
    }
    function heart(r){
      ctx.fillStyle='#ff5da2';
      ctx.beginPath();
      ctx.moveTo(0,r*0.7);
      ctx.bezierCurveTo(-r,-r*0.2,-r*0.4,-r,r*0.3,-r*0.25);
      ctx.bezierCurveTo(r*0.7,-r,r,-r*0.2,0,r*0.7);
      ctx.closePath(); ctx.fill(); ctx.strokeStyle='#c22e75'; ctx.lineWidth=3; ctx.stroke();
    }
    function thumb(r){
      ctx.fillStyle='#36c46b';
      roundRect(-r*0.8,-r*0.95,1.6*r,1.9*r,r*0.3); ctx.fill();
      ctx.fillStyle='#2aa55c';
      ctx.fillRect(-r*0.15,-r*1.0,r*0.4,r*1.5);
      ctx.strokeStyle='#1f7a45'; ctx.lineWidth=3; ctx.strokeRect(-0.75*r,-0.9*r,1.5*r,1.75*r);
    }
    function shine(r){
      ctx.fillStyle='#a855f7';
      ctx.beginPath();
      for(var i=0;i<4;i++){
        var a=-Math.PI/2+i*Math.PI/4;
        ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
        a+=Math.PI/4; ctx.lineTo(Math.cos(a)*r*0.3,Math.sin(a)*r*0.3);
      }
      ctx.closePath(); ctx.fill(); ctx.strokeStyle='#7a2bc0'; ctx.lineWidth=3; ctx.stroke();
    }
    function blab(r){
      ctx.fillStyle='#ffb3c9';
      ctx.beginPath(); ctx.ellipse(0,0,r*0.9,r*0.72,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#ff5da2'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(r*0.4,r*0.6); ctx.lineTo(r*0.9,r*1.3); ctx.lineTo(r*0.15,r*0.9); ctx.closePath(); ctx.stroke(); ctx.fillStyle='#ffb3c9'; ctx.fill();
    }
    function brick(r){
      ctx.fillStyle='#c07a45'; roundRect(-r,-r,2*r,2*r,4); ctx.fill();
      ctx.strokeStyle='#8a4f26'; ctx.lineWidth=3;
      ctx.strokeRect(-r,-r,2*r,2*r);
      ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r*0.5,-r); ctx.lineTo(-r*0.5,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r*0.5,0); ctx.lineTo(r*0.5,r); ctx.stroke();
    }
    function roundRect(x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
    }
    // —— 新增：夸张夸仙猪的掉落物形状 ——
    function crown(r){
      ctx.fillStyle='#ffc93c';
      ctx.beginPath();
      ctx.moveTo(-r, r*0.8);
      ctx.lineTo(-r, -r*0.5);
      ctx.lineTo(-r*0.55, -r*0.05);
      ctx.lineTo(0, -r*0.9);
      ctx.lineTo(r*0.55, -r*0.05);
      ctx.lineTo(r, -r*0.5);
      ctx.lineTo(r, r*0.8);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#c98a00'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#e84a5f';
      ctx.beginPath(); ctx.arc(0,-r*0.15,r*0.22,0,Math.PI*2); ctx.fill();
    }
    function coin(r){
      ctx.fillStyle='#ffd23f';
      ctx.beginPath(); ctx.arc(0,0,r,r*0.9,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#c98a00'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#b8860b';
      ctx.font='bold '+(r*1.1)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('¥',0,1);
    }
    function fire(r){
      ctx.fillStyle='#ff7a1a';
      ctx.beginPath();
      ctx.moveTo(0,r);
      ctx.bezierCurveTo(-r,r*0.3,-r*0.4,-r*0.4,0,-r);
      ctx.bezierCurveTo(r*0.4,-r*0.4,r,r*0.3,0,r);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffd000';
      ctx.beginPath(); ctx.arc(0,r*0.1,r*0.42,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#c24500'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-r*0.2,r*0.4); ctx.lineTo(r*0.2,r*0.4); ctx.stroke();
    }
    function medal(r){
      ctx.fillStyle='#ffca3a';
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#b8860b'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(0,0,r*0.55,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#b8860b'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#e84a5f';
      ctx.font='bold '+(r*0.6)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('1',0,1);
    }
    function puff(r){
      ctx.fillStyle='#b6f0ff';
      ctx.beginPath(); ctx.arc(0,-r*0.3,r*0.7,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-r*0.5,r*0.3,r*0.45,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.5,r*0.3,r*0.45,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(-r*0.25,-r*0.5,r*0.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.3,-r*0.2,r*0.22,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#6fc9ec'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,-r*0.3,r*0.7,0,Math.PI*2); ctx.stroke();
    }
    // —— 新增：诋毁仙猪的掉落物形状 ——
    function snow(r){
      ctx.fillStyle='#dfeaff'; roundRect(-r,-r,2*r,2*r,r*0.4); ctx.fill();
      ctx.strokeStyle='#9cb8e0'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#e84a5f';
      ctx.beginPath(); ctx.arc(-r*0.3,-r*0.2,r*0.4,0,Math.PI*2); ctx.fill();
    }
    function tomato(r){
      ctx.fillStyle='#e84a3c';
      ctx.beginPath(); ctx.arc(0,r*0.05,r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#a92e22'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#2e9e44';
      ctx.beginPath(); ctx.ellipse(0,-r*0.85,r*0.45,r*0.3,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#e84a3c'; ctx.fillRect(-r*0.06,-r*1.0,r*0.12,r*0.3);
      ctx.fillStyle='#8fd18a';
      ctx.beginPath(); ctx.moveTo(-r*0.3,-r*0.8); ctx.lineTo(-r*0.1,-r*0.5); ctx.lineTo(-0.05,-r*0.85); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(r*0.25,-r*0.8); ctx.lineTo(r*0.1,-r*0.5); ctx.lineTo(r*0.4,-r*0.6); ctx.closePath(); ctx.fill();
    }
    function poison(r){
      // 绿色毒瓶
      ctx.fillStyle='#7ed957'; roundRect(-r*0.55,-r,1.1*r,1.8*r,r*0.25); ctx.fill();
      ctx.strokeStyle='#3e7d2e'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(-r*0.9,-r*1.1); ctx.lineTo(r*0.9,-r*0.9); ctx.closePath(); ctx.stroke();
      ctx.fillStyle='#3e7d2e';
      ctx.beginPath(); ctx.arc(-r*0.45,-r*0.9,r*0.14,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.3,-r*0.85,r*0.14,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#eaffea';
      ctx.beginPath(); ctx.arc(0,-r*0.2,r*0.28,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#8a5a39';
      ctx.fillRect(-r*0.08,-r*0.3,r*0.3,r*0.28);
      ctx.fillRect(r*0.08,-r*0.3,r*0.3,r*0.28);
      ctx.fillStyle='#3e7d2e'; ctx.fillRect(-r*0.05,0,r*0.16,r*0.28);
    }
    // —— 新增：更多诋毁仙猪的掉落物形状 ——
    function ice(r){
      ctx.fillStyle='#cfefff'; roundRect(-r,-r,2*r,2*r,r*0.3); ctx.fill();
      ctx.strokeStyle='#8fb8d8'; ctx.lineWidth=3; ctx.stroke();
      ctx.strokeStyle='#a8d4ef'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-r*0.6,0); ctx.lineTo(r*0.6,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-r*0.6); ctx.lineTo(0,r*0.6); ctx.stroke();
    }
    function trash(r){
      ctx.fillStyle='#9aa5b1'; roundRect(-r*0.7,-r*1.6,1.4*r,1.9*r,r*0.18); ctx.fill();
      ctx.strokeStyle='#6b7480'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#b8c0ca'; roundRect(-r*0.8,-r*1.9,1.6*r,0.5*r,r*0.15); ctx.fill();
      ctx.strokeStyle='#6b7480'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#7dd47d';
      ctx.beginPath(); ctx.arc(0,r*0.25,r*0.35,Math.PI,0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-r*0.3,r*0.25); ctx.lineTo(0,-r*0.1); ctx.lineTo(r*0.3,r*0.25); ctx.closePath(); ctx.fill();
    }
    function viper(r){
      ctx.fillStyle='#6fbf44';
      ctx.beginPath();
      ctx.moveTo(-r,0);
      ctx.quadraticCurveTo(-r*0.3,-r*1.6,r*0.6,-r*1.1);
      ctx.quadraticCurveTo(r*1.3,-r*0.7,r*1.1,-r*0.1);
      ctx.quadraticCurveTo(r,-r*0.6,r*0.5,-r*0.7);
      ctx.quadraticCurveTo(-r*0.2,-r*1.0,-r*0.4,-r*0.2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#3e7d2e'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(r*0.75,-r*0.6,r*0.18,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#333';
      ctx.beginPath(); ctx.arc(r*0.82,-r*0.6,r*0.08,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#e3483c';
      ctx.beginPath(); ctx.moveTo(r*1.15,-r*0.5); ctx.lineTo(r*1.5,-r*0.65); ctx.lineTo(r*1.15,-r*0.75); ctx.closePath(); ctx.fill();
    }
    function chart(r){
      ctx.fillStyle='#8a6cf0'; roundRect(-r,-r*0.9,2*r,1.8*r,r*0.2); ctx.fill();
      ctx.strokeStyle='#5b3fc4'; ctx.lineWidth=3; ctx.stroke();
      ctx.strokeStyle='#fff'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(-r*0.7,r*0.5); ctx.lineTo(-r*0.3,r*0.2); ctx.lineTo(r*0.1,r*0.45); ctx.lineTo(r*0.6,-r*0.4); ctx.moveTo(r*0.6,-r*0.4); ctx.lineTo(r*0.85,-r*0.15); ctx.stroke();
    }
    function bomb(r){
      ctx.fillStyle='#374151';
      ctx.beginPath(); ctx.arc(0,r*0.15,r*0.95,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#111827'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='#ffca3a'; ctx.fillRect(-r*0.3,-r*0.05,r*0.18,r*0.35);
      ctx.fillRect(r*0.15,-r*0.05,r*0.18,r*0.35);
      ctx.fillStyle='#e84a5f';
      ctx.beginPath(); ctx.arc(0,r*0.15,r*0.35,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#4b5563'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(r*0.1,-r*0.7); ctx.quadraticCurveTo(r*0.6,-r*0.7,r*0.55,-r*1.15); ctx.stroke();
      ctx.fillStyle='#e3483c';
      ctx.beginPath(); ctx.arc(r*0.5,-r*1.3,r*0.2,0,Math.PI*2); ctx.fill();
    }

    /* ============ 逻辑 ============ */
    function reset(){
      GAME.running=true;
      GAME.score=0; GAME.items=[]; GAME.particles=[]; GAME.gossip=[];
      GAME.pig.x=W/2; GAME.speed=3.2; GAME.spawn=0; GAME.shake=0;
      updateBar();
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('endScreen').classList.add('hidden');
    }
    function endGame(win){
      GAME.running=false;
      ensureAudio();
      if(win){ winSound(); } else { badSound(); }
      var em=document.getElementById('emblem');
      var t=document.getElementById('finalTitle');
      var sub=document.getElementById('finalSub');
      if(win){
        em.textContent='🏆';
        t.textContent='仙猪是帅哥';
        sub.textContent='你成功让全世界都承认：仙猪，是天底下最帅的猪。';
      }else{
        em.textContent='😭';
        t.textContent='你居然怀疑仙猪！';
        sub.textContent='仙猪已经很伤心了…哨声一响，继续去证明仙猪是帅哥吧！（年度自愈式剧情）';
      }
      document.getElementById('endScreen').classList.remove('hidden');
    }
    function spawnItem(){
      var r=Math.random();
      var kind;
      // 好物 = 前9项(t:'good')，坏物 = 后10项(t:'bad')
      var goodN = 9, badN = 10;
      if(GAME.score> GAME.MAX*0.7){ kind = KINDS[Math.random()*KINDS.length|0]; }
      else if(r<0.82){ kind = KINDS[Math.random()*goodN|0]; }             // 多数是好物
      else { kind = KINDS[goodN + (Math.random()*badN|0)]; }              // 适量坏物
      var w=kind.w;
      GAME.items.push({
        kind: kind,           // 掉落物类型定义
        x: rand(w/2+10, W-w/2-10), y:-30,
        w:w,
        phase: rand(0,6.28),  // 旋转相位
        vy: rand(GAME.speed, GAME.speed+1.6),
        spin: rand(-0.2,0.2)
      });
    }
    function catchItem(it){
      GAME.score += it.kind.gain;
      GAME.score = Math.max(0, Math.min(GAME.MAX, GAME.score));
      updateBar();
      addFx(it.x, it.y, it.kind.gain>0?'+':'', it.kind.txt, it.kind.gain>0);
      if(it.kind.gain>0){ GAME.shake=4; goodSound(); } else { GAME.shake=8; badSound(); }
      if(GAME.score>=GAME.MAX){ endGame(true); }
    }
    // 粒子效果
    function addFx(x,y,prefix,txt,good){
      for(var i=0;i<6;i++){
        GAME.particles.push({x:x,y:y,vx:rand(-2,2),vy:rand(-5,-1),life:1,good:good,size:rand(3,6)});
      }
      var label={x:x,y:y-20,vy:-2.2,life:1,txt:prefix+txt,good:good};
      GAME.particles.push(label);
    }
    // 顶部飘过台词
    function maybeGossip(){
      if(GAME.gossip.length<2 && Math.random()<0.06){
        var g=GOSSIP[gossipIdx % GOSSIP.length]; gossipIdx++;
        GAME.gossip.push({txt:g, x:W+40, y:60+Math.random()*120, life:1,
                          color: g.indexOf('崩')>=0||g.indexOf('卡')>=0?'#ff5b5b':'#7a3f7a'});
      }
    }

    /* ============ 更新与绘制主循环 ============ */
    function update(){
      if(!GAME.running) return;
      // 移动
      var dx=0;
      if(GAME.keys.l) dx-=1; if(GAME.keys.r) dx+=1;
      if(GAME.mouse!=null && GAME.mouse.active){ dx = (GAME.mouse.x - GAME.pig.x)/18; }
      if(dx!==0){ GAME.pig.x += dx*7; }
      var half=GAME.pig.w/2;
      if(GAME.pig.x<half) GAME.pig.x=half;
      if(GAME.pig.x>W-half) GAME.pig.x=W-half;

      // 难度随时间提升
      GAME.speed = Math.min(7.5, GAME.speed + 0.02/60*16.7);
      GAME.spawn += 1;
      if(GAME.spawn > (GAME.score>GAME.MAX*0.6?38:46)){ GAME.spawn=0; spawnItem(); }

      // 更新道具
      for(var i=GAME.items.length-1;i>=0;i--){
        var it=GAME.items[i];
        it.y += it.vy;
        it.phase += it.spin;
        it.x += Math.sin(it.y/40)*0.5;
        // 出底
        if(it.y > H+40){ GAME.items.splice(i,1); continue; }
        // 碰撞
        if(it.y + it.w/2 > GAME.pig.y-6 && it.y < GAME.pig.y+GAME.pig.h){
          if(it.x > GAME.pig.x-it.w/2-GAME.pig.w/2 && it.x < GAME.pig.x+it.w/2+GAME.pig.w/2){
            GAME.items.splice(i,1); catchItem(it);
          }
        }
      }
      // 粒子
      for(var p=GAME.particles.length-1;p>=0;p--){
        var pt=GAME.particles[p];
        pt.x+=pt.vx; pt.y+=pt.vy; pt.life-=0.03;
        if(pt.life<=0){ GAME.particles.splice(p,1); }
      }
      // 飘字
      for(var g=GAME.gossip.length-1;g>=0;g--){
        var go=GAME.gossip[g];
        go.x-=0.9;
        go.life-=0.0009;              // 缓慢淡出
        // 文字本身完全向左滑出屏幕或已淡没后移除
        if(go.x < -260 || go.life <= 0.05){ GAME.gossip.splice(g,1); }
      }
      if(GAME.shake>0) GAME.shake-=0.4;
      maybeGossip();
    }

    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.save();
      if(GAME.shake>0){ ctx.translate(rand(-GAME.shake,GAME.shake),rand(-GAME.shake,GAME.shake)); }
      // 地面
      ctx.fillStyle='#8edcff';
      ctx.fillRect(0,0,W,H);
      drawGround();
      // 道具
      GAME.items.forEach(function(it){ drawItem(it); });
      // 玩家
      drawPig(GAME.pig.x,GAME.pig.y,GAME.pig.w, GAME.score>=GAME.MAX);
      // 粒子
      GAME.particles.forEach(function(pt){
        if(pt.txt){ ctx.save(); ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
          ctx.fillStyle=pt.good?'#2aa55c':'#ff5b5b'; ctx.globalAlpha=Math.max(0,pt.life);
          ctx.fillText(pt.txt,pt.x,pt.y); ctx.restore(); }
        else{ ctx.save(); ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.good?'#ffd23f':'#7fa'; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size,0,Math.PI*2); ctx.fill(); ctx.restore(); }
      });
      // 飘字
      GAME.gossip.forEach(function(go){
        ctx.save(); ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
        ctx.fillStyle=go.color; ctx.globalAlpha=Math.max(0, Math.min(1, go.life));
        ctx.fillText(go.txt,go.x,go.y); ctx.restore();
      });
      ctx.restore();
    }
    function drawGround(){
      // 草地地面 + 一点点像素感
      ctx.fillStyle='#7fd086';
      ctx.fillRect(0,H-46,W,46);
      ctx.fillStyle='#6cbb74';
      for(var i=0;i<W;i+=18){ ctx.fillRect(i,H-46,9,5); }
      ctx.fillStyle='rgba(255,255,255,.25)';
      ctx.fillText('仙猪站台 ▶', 14, H-14);
    }

    function loop(){
      update();
      draw();
      requestAnimationFrame(loop);
    }

    /* ============ 输入控制 ============ */
    // 键盘
    window.addEventListener('keydown',function(e){
      if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){ GAME.keys.l=true; }
      if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){ GAME.keys.r=true; }
    });
    window.addEventListener('keyup',function(e){
      if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){ GAME.keys.l=false; }
      if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){ GAME.keys.r=false; }
    });
    // 触屏/鼠标拖动
    var dragging=false;
    function pointerDown(e){
      ensureAudio();
      var pt = e.touches ? e.touches[0] : e;
      var rect = canvas.getBoundingClientRect();
      GAME.mouse={x:(pt.clientX-rect.left)*(W/rect.width), active:true};
      dragging=true;
    }
    function pointerMove(e){
      if(!dragging) return;
      var pt = e.touches ? e.touches[0] : e;
      var rect = canvas.getBoundingClientRect();
      GAME.mouse={x:(pt.clientX-rect.left)*(W/rect.width), active:true};
    }
    function pointerEnd(){ dragging=false; GAME.mouse=null; }
    canvas.addEventListener('mousedown',pointerDown);
    window.addEventListener('mousemove',pointerMove);
    window.addEventListener('mouseup',pointerEnd);
    canvas.addEventListener('touchstart',pointerDown,{passive:true});
    canvas.addEventListener('touchmove',pointerMove,{passive:true});
    canvas.addEventListener('touchend',pointerEnd,{passive:true});
    window.addEventListener('touchcancel',pointerEnd,{passive:true});

    // 移动端虚拟摇杆：按住持续移动，松开停止
    function bindHold(el,key,on){
      var active=false;
      function press(ev){ ev.preventDefault(); ensureAudio(); active=true; GAME.keys[key]=true; }
      function release(){ active=false; GAME.keys[key]=false; }
      el.addEventListener('touchstart',press,{passive:false});
      el.addEventListener('mousedown',press);
      el.addEventListener('touchend',release);
      el.addEventListener('touchcancel',release);
      el.addEventListener('mouseup',release);
      el.addEventListener('mouseleave',function(){ if(active){active=false; GAME.keys[key]=false;} });
    }
    bindHold(document.getElementById('btnLeft'),'l');
    bindHold(document.getElementById('btnRight'),'r');

    // 阻止移动端手势默认行为：防双击/双指缩放、防页面上下滚动
    ['touchstart','touchmove'].forEach(function(ev){
      document.addEventListener(ev,function(e){
        // 保留按钮自身的 preventDefault，滑动容器交给浏览器即可
        if(e.target.classList && e.target.classList.contains('touch-btn')){ return; }
      },{passive:false});
    });

    // 音效开关
    var muteBtn=document.getElementById('muteBtn');
    muteBtn.addEventListener('click',function(){ muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; });

    // 按钮
    document.getElementById('startBtn').addEventListener('click',function(){ ensureAudio(); reset(); });
    document.getElementById('againBtn').addEventListener('click',function(){ reset(); });

    // HUD
    function updateBar(){
      var pct=(GAME.score/GAME.MAX*100).toFixed(1)+'%';
      document.getElementById('bar').style.width=(GAME.score/GAME.MAX*100)+'%';
      document.getElementById('score').textContent=GAME.score+' / '+GAME.MAX;
    }

    // 首屏和结束也有一句引子
    updateBar();

    // 启动循环
    requestAnimationFrame(loop);
  }catch(e){

  }
})();
