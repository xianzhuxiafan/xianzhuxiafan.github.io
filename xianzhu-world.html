  hpB.style.width = clamp(Player.hp/Player.maxHp*100,0,100)+'%';
  hpT.textContent = 'HP '+Math.ceil(Player.hp)+'/'+Player.maxHp;
  document.getElementById('hgBar').style.width = Player.hg+'%';
  document.getElementById('hgTxt').textContent = '饱食 '+Math.ceil(Player.hg);
  document.getElementById('stBar').style.width = Player.st+'%';
  document.getElementById('stTxt').textContent = '体力 '+Math.ceil(Player.st);
  var oxw = document.getElementById('oxWrap');
  if (Player.ox<80 || Player.inWater){ oxw.style.display='block'; }
  else oxw.style.display='none';
  document.getElementById('oxBar').style.width = Player.ox+'%';
  document.getElementById('oxTxt').textContent = '氧气 '+Math.ceil(Player.ox);
  // 时钟
  var hr = Math.floor(Clock.t*24), mn = Math.floor((Clock.t*24%1)*60);
  var phase = Clock.t<0.2?'夜':Clock.t<0.3?'晨':Clock.t<0.7?'昼':Clock.t<0.8?'暮':'夜';
  document.getElementById('clockIc').textContent = Clock.t<0.2||Clock.t>0.8?'☾':Clock.t<0.3||Clock.t>0.7?'☼':'☀';
  document.getElementById('clockTxt').textContent = '第 '+Clock.day+' 天 · '+pad(hr)+':'+pad(mn)+' '+phase;
  // 种子/坐标
  var bx = Math.floor(Player.x/TILE), by = Math.floor(Player.y/TILE);
  document.getElementById('seedbox').innerHTML = '种子: <b>'+World.name+'</b><br>坐标: <b>'+bx+','+by+'</b><br>生物群系: <b>'+BIOMES[getBiome(bx)]+'</b>';
  // 任务
  var q = '九转金丹: <b>'+Player.pills+'/9</b><br>遗迹探索: <b>'+Player.clearedRuins+'/9</b><br>';
  if (Player.bossDefeated) q += '天蓬元帅: <b style="color:#7eff7e">已降伏</b>';
  else if (Player.bossSpawned) q += '天蓬元帅: <b style="color:#ff7e7e">激战中</b>';
  else q += '天蓬元帅: <b>未现</b>';
  document.getElementById('quest').innerHTML = q;
}
function pad(n){return n<10?'0'+n:''+n;}
function updateHotbar(){
  var hb = document.getElementById('hotbar'); hb.innerHTML='';
  for (var i=0;i<9;i++){
    var slot = document.createElement('div'); slot.className='slot'+(i===Player.sel?' sel':'');
    var it = Player.inv[i];
    if (it){
      var c = document.createElement('canvas'); c.width=24; c.height=24;
      var g = c.getContext('2d'); g.imageSmoothingEnabled=false;
      drawItemIcon(g, it.id, 0, 0, 24);
      slot.appendChild(c);
      var n = document.createElement('div'); n.className='n'; n.textContent=it.n>1?it.n:''; slot.appendChild(n);
    }
    var k = document.createElement('div'); k.className='key'; k.textContent=(i+1); slot.appendChild(k);
    hb.appendChild(slot);
  }
}
var toastTimer = 0;
function toast(msg, dur){
  dur = dur||1.5;
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, dur*1000);
}

/* ========== 面板：背包 / 合成 / 暂停 / 胜利 / 失败 ========== */
var PanelOpen = false;
var currentPanel = null; // 'inv' | 'craft' | 'pause' | 'death' | 'win' | 'about'
function openPanel(html, type){ var p=document.getElementById('panel'); p.innerHTML='<div class="card">'+html+'</div>'; p.classList.add('on'); PanelOpen=true; currentPanel=type||null; }
function closePanel(){ var p=document.getElementById('panel'); p.classList.remove('on'); p.innerHTML=''; PanelOpen=false; currentPanel=null; }
function toggleInv(){
  if (PanelOpen && currentPanel==='inv'){ closePanel(); return; }
  if (PanelOpen && (currentPanel==='pause'||currentPanel==='death'||currentPanel==='win')) return;
  if (PanelOpen) closePanel();
  var html = '<h1>物品栏</h1><p style="text-align:center;color:#8a5a22;font-size:.85em">点击格子选中物品；右键丢弃</p>';
  html += '<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:.25em;margin-top:.5em;">';
  for (var i=0;i<36;i++){
    var it = Player.inv[i];
    html += '<div class="slot" data-idx="'+i+'" style="width:2.4em;height:2.4em;cursor:pointer;border:2px solid '+(i===Player.sel?'#ffd76b':'rgba(255,255,255,.18)')+';">';
    if (it){
      html += '<canvas width="22" height="22" data-item="'+it.id+'"></canvas>';
      if (it.n>1) html += '<div class="n">'+it.n+'</div>';
    }
    html += '<div class="key" style="font-size:.55em;">'+(i<9?(i+1):'')+'</div>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="row"><button class="btn" onclick="document.getElementById(\'btnClosePanel\').click()">关闭</button></div>';
  html += '<button id="btnClosePanel" style="display:none"></button>';
  openPanel(html, 'inv');
  // 渲染物品图标
  var canvases = document.querySelectorAll('#panel canvas[data-item]');
  for (var i=0;i<canvases.length;i++){
    var cv = canvases[i]; var id = cv.getAttribute('data-item');
    var g = cv.getContext('2d');    g.imageSmoothingEnabled=false;
    drawItemIcon(g, id, 0, 0, 22);
  }
  // 绑定点击
  var slots = document.querySelectorAll('#panel .slot');
  for (var i=0;i<slots.length;i++){
    (function(s, idx){
      s.onmousedown = function(e){
        if (e.button===2){
          // 丢弃
          if (Player.inv[idx]){
            dropItem(Player.inv[idx].id, Player.inv[idx].n, Player.x, Player.y);
            Player.inv[idx]=null;
            toggleInv(); toggleInv();
          }
        } else {
          if (idx<9){ Player.sel = idx; updateHotbar(); toggleInv(); }
        }
      };
    })(slots[i], parseInt(slots[i].getAttribute('data-idx')));
  }
  document.getElementById('btnClosePanel').onclick = closePanel;
}
function toggleCraft(){
  if (PanelOpen && currentPanel==='craft'){ closePanel(); return; }
  if (PanelOpen && (currentPanel==='pause'||currentPanel==='death'||currentPanel==='win')) return;
  if (PanelOpen) closePanel();
  var html = '<h1>炼丹台</h1><p style="text-align:center;color:#8a5a22;font-size:.85em">点击配方合成（材料需充足）</p>';
  html += '<div class="craft-grid" id="craftList">';
  for (var i=0;i<RECIPES.length;i++){
    var r = RECIPES[i];
    var ok = canCraft(r, Player.inv);
    html += '<div class="recipe'+(ok?'':'" style="opacity:.4')+'" data-idx="'+i+'">';
    html += '<div class="ic"><canvas width="22" height="22" data-item="'+r.out.id+'"></canvas></div>';
    var nm = IT[r.out.id].n + ' ×'+r.out.n;
    var mat = r.in.map(function(x){return IT[x.id].n?IT[x.id].n+'×'+IT[x.id].n:'';}).join(' + ');
    html += '<div class="nm">'+nm+'<small>'+r.in.map(function(x){return IT[x.id].n+(IT[x.id].n&&IT[x.id].n>=2?'×':'')+IT[x.id].n;}).join(' + ')+'</small></div>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="row"><button class="btn" onclick="document.getElementById(\'btnCloseCraft\').click()">关闭</button></div>';
  html += '<button id="btnCloseCraft" style="display:none"></button>';
  openPanel(html, 'craft');
  // 渲染图标
  var canvases = document.querySelectorAll('#panel canvas[data-item]');
  for (var i=0;i<canvases.length;i++){
    var cv = canvases[i]; var id = cv.getAttribute('data-item');
    var g = cv.getContext('2d'); g.imageSmoothingEnabled=false;
    drawItemIcon(g, id, 0, 0, 22);
  }
  // 绑定
  var recs = document.querySelectorAll('#panel .recipe');
  for (var i=0;i<recs.length;i++){
    recs[i].onclick = function(){
      var idx = parseInt(this.getAttribute('data-idx'));
      var r = RECIPES[idx];
      if (!canCraft(r, Player.inv)){ toast('材料不足', 1); return; }
      for (var j=0;j<r.in.length;j++) removeItem(Player.inv, r.in[j].id, r.in[j].n);
      addItem(Player.inv, r.out.id, r.out.n);
      toast('合成 '+IT[r.out.id].n+' ×'+r.out.n, 1);
      updateHotbar();
      // 刷新面板
      toggleCraft(); toggleCraft();
    };
  }
  document.getElementById('btnCloseCraft').onclick = closePanel;
}
function togglePause(){
  // 在死亡/胜利面板时不响应 Esc
  if (GameState==='menu') return;
  if (PanelOpen && currentPanel==='pause'){ closePanel(); resumeGame(); return; }
  if (PanelOpen){ closePanel(); resumeGame(); return; }
  if (GameState!=='play') return;
  pauseGame();
  var html = '<h1>暂停</h1>';
  html += '<p style="text-align:center">种子：<b>'+World.name+'</b>　第 <b>'+Clock.day+'</b> 天</p>';
  html += '<div class="row"><button class="btn" onclick="window.__resume()">继续</button></div>';
  html += '<div class="row"><button class="btn alt" onclick="window.__save()">保存游戏</button>';
  html += '<button class="btn ghost" onclick="window.__quit()">返回主菜单</button></div>';
  html += '<h2>操作说明</h2>';
  html += '<p>• <b>A/D</b> 或 <b>←/→</b>：移动</p>';
  html += '<p>• <b>W/Space/↑</b>：跳跃 / 游泳上浮</p>';
  html += '<p>• <b>Shift</b>：冲刺（消耗体力）</p>';
  html += '<p>• <b>鼠标左键</b>：挖方块 / 攻击（持剑时）</p>';
  html += '<p>• <b>鼠标右键</b>：放置选中方块</p>';
  html += '<p>• <b>鼠标滚轮 / 1-9</b>：切换热栏</p>';
  html += '<p>• <b>E</b>：背包　<b>C</b>：合成　<b>Esc</b>：暂停</p>';
  html += '<h2>通关目标</h2>';
  html += '<p>探索 <b>9 处遗迹</b>，收集 <b>9 颗九转金丹</b>，召唤并击败 <b>天蓬元帅</b> 即可飞升成仙。</p>';

}
function onPlayerDeath(src){
  pauseGame();
  var html = '<h1 style="color:#a8451a">陨落</h1>';
  html += '<p style="text-align:center">你被 <b>'+(src||'未知力量')+'</b> 击败。</p>';
  html += '<p style="text-align:center">第 <b>'+Clock.day+'</b> 天，种子：<b>'+World.name+'</b>，金丹：<b>'+Player.pills+'/9</b></p>';
  html += '<div class="news">仙猪忠告：黑夜是敌对生物狂欢之时。装备好剑甲再出门探险，火把照亮可防飞剑刷新。掉进水里要赶紧上岸。</div>';
  html += '<div class="row"><button class="btn" onclick="window.__retry()">原地复活</button>';
  html += '<button class="btn ghost" onclick="window.__quit()">返回主菜单</button></div>';
  openPanel(html, 'death');
  window.__retry = function(){ closePanel(); Player.hp=Player.maxHp; Player.hg=Math.max(Player.hg,60); Player.alive=true; Player.invuln=2;
    // 复活到地表
    var sx = Math.floor(Player.x/TILE), sy=World.surfaceY[sx]-2;
    Player.x = sx*TILE+TILE/2; Player.y = sy*TILE; Player.vx=0; Player.vy=0;
    resumeGame();
  };
  window.__quit = function(){ closePanel(); toMenu(); };
}
function onBossDefeated(){
  pauseGame();
  playSound('win');
  var html = '<h1 style="color:#c8541d">飞升成仙！</h1>';
  html += '<p style="text-align:center">你击败了 <b>天蓬元帅</b>，集齐 <b>9</b> 颗九转金丹。</p>';
  html += '<p style="text-align:center">第 <b>'+Clock.day+'</b> 天通关　种子：<b>'+World.name+'</b></p>';
  html += '<div class="news">天蓬元帅：「哼！本帅认输。看在你这凡人有几分骨气，本帅便赐你一界仙猪之位。从此你便是 <b>仙猪世界</b> 之主！」<br><br>系统：通关达成。继续探索？换种子再玩一次？</div>';

/* ========== 存档 ========== */
function saveGame(){
  try{
    var data = {
      seed:World.name, day:Clock.day, t:Clock.t,
      px:Player.x, py:Player.y, hp:Player.hp, hg:Player.hg, st:Player.st,
      pills:Player.pills, clearedRuins:Player.clearedRuins,
      bossSpawned:Player.bossSpawned, bossDefeated:Player.bossDefeated,
      sel:Player.sel, inv:Player.inv,
      cleared:World.structures.map(function(s){return s.cleared?1:0;}),
      mobs:Mobs.map(function(m){return {type:m.type,x:m.x,y:m.y,hp:m.hp};})
    };
    localStorage.setItem('xianzhu_save_'+World.name, JSON.stringify(data));
    return true;
  }catch(e){ console.error(e); return false; }
}
function loadGame(seedName){
  try{
    var raw = localStorage.getItem('xianzhu_save_'+seedName);
    if (!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

/* ========== 游戏状态机 ========== */
var GameState = 'menu'; // menu | play | paused
var lastTime = 0;
var savePending = false;

function startGame(seedName){
  closePanel();
  // 尝试加载存档
  var save = loadGame(seedName);
  generateWorld(seedName);
  World.name = seedName;
  resetPlayer();
  Mobs = [];
  DroppedItems = [];
  Clock.day = 1; Clock.t = 0.28;
  if (save){
    Clock.day = save.day; Clock.t = save.t;
    Player.pills = save.pills||0;
    Player.clearedRuins = save.clearedRuins||0;
    Player.bossSpawned = save.bossSpawned||false;
    Player.bossDefeated = save.bossDefeated||false;
    Player.x = save.px; Player.y = save.py;
    Player.hp = save.hp; Player.hg = save.hg; Player.st = save.st;
    Player.sel = save.sel||0;
    if (save.inv) Player.inv = save.inv;
    if (save.cleared) for (var i=0;i<World.structures.length;i++) World.structures[i].cleared = !!save.cleared[i];
    if (save.mobs) for (var i=0;i<save.mobs.length;i++){ var mm=save.mobs[i]; spawnMob(mm.type, mm.x, mm.y); }
    toast('存档已恢复 · 第 '+Clock.day+' 天', 2.5);
  } else {
    spawnPlayer();
  }
  // 初始生物
  if (Mobs.length===0){
    for (var i=0;i<5;i++){
      var x = Math.floor(World.W/2) + Math.floor(rnd(-30,30));
      x = clamp(x, 2, World.W-2);
      var y = World.surfaceY[x]-2;
      var b = getBiome(x);
      if (b==='forest') spawnMob('pig', x*TILE+TILE/2, y*TILE);
      else if (b==='mush') spawnMob('carrot', x*TILE+TILE/2, y*TILE);
    }
  }
  updateHotbar();
  GameState = 'play';
  lastTime = performance.now();
  hideMenu();
  document.getElementById('frame').style.display='block';
}
function pauseGame(){ if (GameState==='play') GameState='paused'; }
function resumeGame(){ if (GameState==='paused'){ GameState='play'; lastTime=performance.now(); } }
function toMenu(){
  GameState='menu';
  closePanel();
  showMenu();
}
function autoSaveTick(){
  if (GameState!=='play') return;
  if (savePending) return;
  savePending = true;
  setTimeout(function(){ saveGame(); savePending=false; }, 100);
}

/* ========== 主菜单 ========== */
function showMenu(){
  try {
    var f = document.getElementById('frame');
    // 不直接显示 frame，而是显示菜单覆盖层
    var menu = document.getElementById('menuLayer');
    if (!menu){
      menu = document.createElement('div');
      menu.id='menuLayer';
      menu.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a2440,#2a3050);z-index:99;pointer-events:auto;';
      f.appendChild(menu);
    }
    menu.style.display='flex';
    // 先画 canvas 底色防止黑闪
    if (Ctx){
      Ctx.fillStyle='#1a2440'; Ctx.fillRect(0,0,CanvasW,CanvasH);
    }
    // 列出存档列表
    var saves = [];
    try {
      for (var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if (k.indexOf('xianzhu_save_')===0){
          saves.push(k.slice(13));
        }

    } catch(e){}

      savesHtml += '<div class="news" style="margin-top:1em;"><b>已有存档：</b><br>';

        savesHtml += '<button class="ibtn" style="font-size:.7em;padding:.3em .6em" onclick="window.__del(\''+safe+'\')">删</button><br>';
      }
      savesHtml += '</div>';
    }
    menu.innerHTML = '<div class="card" style="width:min(94%,42em)">'+
      '<h1>仙猪世界</h1>'+
      '<p style="text-align:center;color:#8a5a22;font-size:.95em">无厘头 2D 沙盒生存 · 单文件 HTML</p>'+
      '<p>你将扮演一名凡人，降临到这片充满仙气的世界。需要探索 <b>9 处遗迹</b>，收集 <b>9 颗九转金丹</b>，召唤并击败 <b>天蓬元帅</b>，方能飞升成仙。</p>'+
      '<div class="news"><b>玩法要点：</b><br>• WASD/方向键移动，W/Space 跳跃，Shift 冲刺<br>• 鼠标左键挖方块或攻击（持剑时）<br>• 鼠标右键放置选中方块，滚轮/1-9 切换热栏<br>• E 背包，C 合成，Esc 暂停<br>• 夜晚会刷出敌对飞剑，记得造火把避难'+
      '<br><br><b>遗迹分布：</b> 苔石神庙、矿洞遗迹、仙人村、葫芦塔、炼丹炉、沙漠金字塔、冰宫、月宫、通天玉柱（共 9 处，地图上以红点标注）</div>'+
      '<h2>输入世界种子</h2>'+
      '<div style="text-align:center"><input class="seed-input" id="seedInput" value="仙猪'+Math.floor(Math.random()*999)+'" maxlength="16"></div>'+
      '<div class="checkrow"><label class="chk"><input type="checkbox" id="cbHard">困难模式（敌对生物更强）</label></div>'+
      '<div class="row"><button class="btn" onclick="window.__start()">开始游戏</button>'+
      '<button class="btn alt" onclick="window.__rand()">随机种子</button></div>'+
      savesHtml+
      '<div class="row" style="margin-top:.5em"><button class="btn ghost" onclick="window.__about()">关于</button></div>'+
      '</div>';
    window.__start = function(){
      var s = document.getElementById('seedInput').value.trim() || ('仙猪'+Math.floor(Math.random()*9999));
      startGame(s);
    };
    window.__rand = function(){
      document.getElementById('seedInput').value = '仙猪'+Math.floor(Math.random()*99999);
    };
    window.__load = function(s){ startGame(s); };
    window.__del = function(s){ localStorage.removeItem('xianzhu_save_'+s); showMenu(); };
    window.__about = function(){
      openPanel('<h1>关于仙猪世界</h1>'+
        '<p>「<b>仙猪世界</b>」是一个单文件 HTML 沙盒生存游戏，融合 <i>泰拉瑞亚</i> 玩法与 <i>西游记</i> 无厘头设定。</p>'+
        '<p>所有内容（地图、遗迹、生物、UI）均由代码程序化生成，无外部资源依赖。每个种子对应一个独一无二的世界。</p>'+
        '<p>开发：仙猪工作室　版本：v1.0</p>'+
        '<div class="row"><button class="btn" onclick="closePanelUI()">关闭</button></div>');
      window.closePanelUI = closePanel;
    };
  } catch(err){
    console.error('showMenu failed:', err);
    var el = document.getElementById('errbar');
    if (el){ el.style.display='block'; el.textContent = '主菜单加载失败：' + err.message; }
  }
}
function hideMenu(){
  var m = document.getElementById('menuLayer');
  if (m) m.style.display='none';
}

/* ========== 主循环 ========== */
function loop(now){
  requestAnimationFrame(loop);
  if (GameState!=='play') return;
  var dt = (now - lastTime)/1000;
  lastTime = now;
  if (dt>0.1) dt=0.1; // 防止跳帧过大
  if (dt<=0) return;
  // 更新
  tickClock(dt);
  if (Player.alive){
    moveAndCollide(dt);
    tickPlayerAction(dt);
  }
  tickMobs(dt);
  tickDrops(dt);
  tickSpawning(dt);
  tickWater(dt);
  updateCamera(dt);
  // 自动保存（每 30 秒）
  if ((now - (loop.lastSave||0)) > 30000){ saveGame(); loop.lastSave = now; }
  // 渲染
  try { render(); } catch(e){ console.error('render error', e); }
  // HUD
  try { updateHUD(); } catch(e){ console.error('hud error', e); }
}

/* ========== 启动 ========== */
function init(){
  try {
    fitCanvas();
    window.addEventListener('resize', function(){
      try { fitCanvas(); } catch(e){}
    });
    bindInput();
    // 顶部按钮
    document.getElementById('btnInv').onclick = toggleInv;
    document.getElementById('btnCraft').onclick = toggleCraft;
    document.getElementById('btnPause').onclick = togglePause;
    // 启动主循环
    requestAnimationFrame(loop);
    showMenu();
  } catch(err){
    console.error('init failed:', err);
    var el = document.getElementById('errbar');
    if (el){ el.style.display='block'; el.textContent = '启动失败：' + err.message; }
  }
}
init();

})();
