<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>仙猪世界 · XianZhu Craft</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1a;
            font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;}
  #frame{position:relative;width:100%;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
  #ui{position:absolute;inset:0;pointer-events:none;user-select:none;}

  /* 顶部 HUD */
  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
       align-items:flex-start;padding:.55em .8em;pointer-events:none;}
  .stats{display:flex;flex-direction:column;gap:.25em;}
  .bar{width:13em;height:.85em;background:rgba(0,0,0,.55);border-radius:999px;overflow:hidden;
       box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);}
  .bar > i{display:block;height:100%;border-radius:999px;transition:width .25s;}
  .bar.hp > i{background:linear-gradient(#ff6a6a,#c81e1e)}
  .bar.hg > i{background:linear-gradient(#ffb347,#d97a14)}
  .bar.st > i{background:linear-gradient(#7ad27a,#2e9c2e)}
  .bar.ox > i{background:linear-gradient(#7ad0ff,#1e7fc8)}
  .bar small{font-size:.7em;color:#ffe9c2;font-weight:700;text-shadow:0 1px 2px #000;
              margin-left:.4em;vertical-align:1px}
  .clock{display:flex;align-items:center;gap:.4em;background:rgba(12,18,30,.5);
         padding:.35em .8em;border-radius:999px;font-size:.85em;font-weight:700;
         text-shadow:0 1px 2px #000;backdrop-filter:blur(4px);}
  .clock .ic{font-size:1.1em}

  /* 热栏 */
  .hotbar{position:absolute;left:50%;bottom:.7em;transform:translateX(-50%);
          display:flex;gap:.25em;padding:.25em;background:rgba(12,18,30,.5);
          border-radius:.6em;backdrop-filter:blur(4px);pointer-events:none;}
  .slot{width:3em;height:3em;background:rgba(255,255,255,.08);border-radius:.35em;
        position:relative;border:2px solid rgba(255,255,255,.18);overflow:hidden;}
  .slot.sel{border-color:#ffd76b;box-shadow:0 0 0 2px #ffd76b80,0 0 14px #ffd76b80;}
  .slot canvas{position:absolute;inset:0;width:100%;height:100%}
  .slot .n{position:absolute;right:2px;bottom:0;font-size:.72em;font-weight:800;
           color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;}
  .slot .key{position:absolute;left:2px;top:0;font-size:.6em;color:#ffe9b0;
             text-shadow:0 1px 1px #000;font-weight:700;}

  /* 种子/坐标 */
  .seedbox{position:absolute;left:.6em;bottom:.7em;font-size:.78em;font-weight:700;
           color:#ffe9c2;background:rgba(12,18,30,.55);padding:.4em .7em;border-radius:.5em;
           text-shadow:0 1px 2px #000;backdrop-filter:blur(4px);line-height:1.45;}
  .seedbox b{color:#ffd76b}
  .quest{position:absolute;right:.6em;bottom:.7em;font-size:.78em;font-weight:700;
         color:#fff;background:rgba(12,18,30,.55);padding:.4em .7em;border-radius:.5em;
         text-shadow:0 1px 2px #000;backdrop-filter:blur(4px);line-height:1.45;text-align:right;}
  .quest b{color:#ffd76b}

  /* 弹窗/面板 */
  #panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
         background:rgba(8,12,22,.6);backdrop-filter:blur(6px);pointer-events:auto;z-index:10}
  #panel.on{display:flex}
  .card{width:min(92%,40em);max-height:92%;overflow:auto;background:linear-gradient(#fffdf6,#ffe7c4);
        border-radius:1.2em;padding:1.5em 1.6em;text-align:center;color:#41290f;
        box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 .3em #ffd88a,inset 0 0 0 .45em #e8a83c;
        animation:pop .32s cubic-bezier(.2,1.5,.5,1);}
  @keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
  .card h1{font-size:2.4em;letter-spacing:.05em;color:#c8541d;
           text-shadow:0 3px 0 #fff2cc,0 5px 0 #e2a95b;margin-bottom:.15em;}
  .card h2{font-size:1.4em;color:#a8451a;margin:.5em 0;}
  .card p{font-size:.92em;line-height:1.7;color:#6b4a24;text-align:left;margin:.4em 0}
  .card p b{color:#c8541d}
  .tag{display:inline-block;font-size:.78em;font-weight:700;color:#8a5a22;background:#fff3d4;
       border-radius:999px;padding:.18em .7em;margin:.2em;}
  .row{display:flex;gap:.7em;justify-content:center;flex-wrap:wrap;margin-top:1.1em}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:1em;
       padding:.7em 1.5em;border-radius:999px;color:#fff;
       background:linear-gradient(#ff9c4a,#ef6a1c);box-shadow:0 4px 0 #b8460c,0 8px 18px rgba(0,0,0,.28);
       transition:transform .08s;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8460c}
  .btn.alt{background:linear-gradient(#8fd0f0,#3f9bd0);box-shadow:0 4px 0 #23688f,0 8px 18px rgba(0,0,0,.28)}
  .btn.alt:active{box-shadow:0 1px 0 #23688f}
  .btn.ghost{background:linear-gradient(#e7e1d3,#c8c0ad);color:#41290f;box-shadow:0 4px 0 #9a917e}
  .btn.ghost:active{box-shadow:0 1px 0 #9a917e}
  .seed-input{font-family:inherit;font-size:1em;font-weight:700;padding:.55em .8em;
               border:.18em solid #d8a35a;border-radius:.6em;width:14em;text-align:center;
               background:#fffdf6;color:#41290f;outline:none;}
  .seed-input:focus{border-color:#ef6a1c}
  .checkrow{display:flex;justify-content:center;gap:1.2em;flex-wrap:wrap;margin:.8em 0;}
  .chk{display:inline-flex;align-items:center;gap:.35em;font-weight:700;color:#6b4a24;cursor:pointer}
  .chk input{width:1.1em;height:1.1em}
  .news{font-size:.85em;color:#8a5a22;text-align:left;background:#fff3d4;border-radius:.6em;
        padding:.6em .9em;margin:.5em 0;line-height:1.6;}
  .news b{color:#c8541d}

  /* 合成 */
  .craft-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5em;margin:.5em 0;}
  .recipe{display:flex;align-items:center;gap:.5em;background:#fff3d4;border-radius:.5em;
          padding:.45em .6em;cursor:pointer;border:2px solid transparent;}
  .recipe:hover{border-color:#ef9a30}
  .recipe .ic{width:2em;height:2em;flex:none;position:relative}
  .recipe .ic canvas{position:absolute;inset:0;width:100%;height:100%}
  .recipe .nm{font-weight:700;color:#41290f;font-size:.85em;text-align:left;flex:1}
  .recipe .nm small{display:block;color:#8a5a22;font-weight:600}

  /* 提示 */
  .toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);
         background:rgba(12,18,30,.78);color:#fff;padding:.5em 1.1em;border-radius:999px;
         font-size:.85em;font-weight:700;text-shadow:0 1px 2px #000;backdrop-filter:blur(4px);
         opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 帮助/暂停按钮 */
  .topbtns{position:absolute;top:.55em;right:.55em;display:flex;gap:.4em;pointer-events:auto}
  .ibtn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:.78em;
        padding:.4em .8em;border-radius:999px;color:#3b2a12;
        background:linear-gradient(#ffe7a8,#f4c85c);
        box-shadow:0 2px 0 #b98a25,0 4px 10px rgba(0,0,0,.25);}
  .ibtn:active{transform:translateY(2px);box-shadow:0 0 0 #b98a25}

  #errbar{position:absolute;left:0;right:0;bottom:0;z-index:99;display:none;
          background:rgba(168,26,26,.94);color:#fff;font-size:.78em;font-weight:600;
          padding:.55em .9em;white-space:pre-wrap;word-break:break-all;pointer-events:auto}

  /* 移动端虚拟摇杆与按钮（默认隐藏，移动设备显示） */
  .touchCtrl{position:absolute;inset:0;display:none;pointer-events:none;z-index:6;}
  .touchCtrl.on{display:block}
  .stick{position:absolute;left:4vw;bottom:18vw;width:22vw;height:22vw;max-width:140px;max-height:140px;
         min-width:90px;min-height:90px;pointer-events:auto;}
  .stick-base{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.18);
              border:3px solid rgba(255,255,255,.35);backdrop-filter:blur(3px);}
  .stick-knob{position:absolute;left:50%;top:50%;width:40%;height:40%;margin-left:-20%;margin-top:-20%;
              border-radius:50%;background:rgba(255,215,107,.85);border:2px solid #fff;
              box-shadow:0 3px 8px rgba(0,0,0,.4);transition:transform .05s}
  .actionBtns{position:absolute;right:4vw;bottom:18vw;display:flex;flex-direction:column;gap:2.5vw;
              align-items:flex-end;pointer-events:auto;}
  .tbtn{width:18vw;height:18vw;max-width:70px;max-height:70px;min-width:50px;min-height:50px;border-radius:50%;
        border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);backdrop-filter:blur(4px);
        color:#fff;font-weight:800;font-size:1.3em;pointer-events:auto;cursor:pointer;
        box-shadow:0 3px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;}
  .tbtn:active{background:rgba(255,215,107,.5);transform:scale(.9)}
  .tbtn.tjump{background:rgba(46,156,46,.35)}
  .tbtn.tmine{background:rgba(168,26,26,.35)}
  .tbtn.tplace{background:rgba(63,155,208,.35)}

  /* 移动设备：隐藏鼠标相关的顶部文字 */
  @media (max-width: 800px) and (pointer: coarse){
    .topbtns .ibtn{font-size:.7em;padding:.3em .6em}
    .hotbar .slot{width:2.4em;height:2.4em}
    .seedbox,.quest{font-size:.7em}
  }
</style>
</head>
<body>
<div id="frame">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div class="hud">
      <div class="stats">
        <div class="bar hp"><i id="hpBar" style="width:100%"></i><small id="hpTxt">HP 100/100</small></div>
        <div class="bar hg"><i id="hgBar" style="width:100%"></i><small id="hgTxt">饱食 100</small></div>
        <div class="bar st"><i id="stBar" style="width:100%"></i><small id="stTxt">体力 100</small></div>
        <div class="bar ox" id="oxWrap" style="display:none"><i id="oxBar" style="width:100%"></i><small id="oxTxt">氧气 100</small></div>
      </div>
      <div class="clock"><span class="ic" id="clockIc">☀</span><span id="clockTxt">第 1 天 · 06:00</span></div>
      <div class="topbtns">
        <button class="ibtn" id="btnInv">背包[E]</button>
        <button class="ibtn" id="btnCraft">合成[C]</button>
        <button class="ibtn" id="btnPause">暂停[Esc]</button>
      </div>
    </div>
    <div class="hotbar" id="hotbar"></div>
    <div class="seedbox" id="seedbox">种子: <b>—</b><br>坐标: <b>—</b><br>生物群系: <b>—</b></div>
    <div class="quest" id="quest">九转金丹: <b>0/9</b><br>遗迹探索: <b>0/9</b><br>天蓬元帅: <b>未现</b></div>
    <!-- 移动端虚拟摇杆与按钮 -->
    <div class="touchCtrl" id="touchCtrl">
      <div class="stick" id="stick">
        <div class="stick-base"></div>
        <div class="stick-knob" id="stickKnob"></div>
      </div>
      <div class="actionBtns">
        <button class="tbtn tjump" id="tJump">跳</button>
        <button class="tbtn tmine" id="tMine">⛏</button>
        <button class="tbtn tplace" id="tPlace">▢</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <div id="panel"></div>
    <div id="errbar"></div>
  </div>
</div>

<script>
/* =========================================================================
   仙猪世界 (XianZhu Craft) —— 单文件 2D 沙盒生存
   玩法：种子世界 → 探索9处遗迹 → 收集9颗九转金丹 → 召唤天蓬元帅 → 击败通关
   ========================================================================= */
(function () {
'use strict';
window.addEventListener('error', function (e) {
  var el = document.getElementById('errbar');
  if (!el) return;
  el.style.display = 'block';
  el.textContent = '运行错误：' + (e.message || e.error || '未知') + '（第 ' + (e.lineno || 0) + ' 行）';
});

/* ========== 音效（Web Audio API 合成） ========== */
var AudioCtxt = null;
var SoundOn = true;
function initAudio(){
  if (AudioCtxt) return;
  try { AudioCtxt = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ AudioCtxt=null; }
}
function playSound(type){
  if (!SoundOn) return;
  initAudio();
  if (!AudioCtxt) return;
  if (AudioCtxt.state==='suspended') AudioCtxt.resume();
  var t = AudioCtxt.currentTime;
  var osc, gain;
  switch(type){
    case 'mine':
      osc = AudioCtxt.createOscillator(); osc.type='square'; osc.frequency.setValueAtTime(160,t); osc.frequency.exponentialRampToValueAtTime(60,t+0.12);
      gain = AudioCtxt.createGain(); gain.gain.setValueAtTime(0.22,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.14);
      osc.connect(gain); gain.connect(AudioCtxt.destination); osc.start(t); osc.stop(t+0.15); break;
    case 'mine2':
      osc = AudioCtxt.createOscillator(); osc.type='square'; osc.frequency.setValueAtTime(240,t); osc.frequency.exponentialRampToValueAtTime(80,t+0.1);
      gain = AudioCtxt.createGain(); gain.gain.setValueAtTime(0.18,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      osc.connect(gain); gain.connect(AudioCtxt.destination); osc.start(t); osc.stop(t+0.13); break;
    case 'jump':
      osc = AudioCtxt.createOscillator(); osc.type='triangle'; osc.frequency.setValueAtTime(300,t); osc.frequency.exponentialRampToValueAtTime(600,t+0.12);
      gain = AudioCtxt.createGain(); gain.gain.setValueAtTime(0.18,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.14);
      osc.connect(gain); gain.connect(AudioCtxt.destination); osc.start(t); osc.stop(t+0.15); break;
    case 'hit':
      osc = AudioCtxt.createOscillator(); osc.type='sawtooth'; osc.frequency.setValueAtTime(120,t); osc.frequency.exponentialRampToValueAtTime(40,t+0.2);
      gain = AudioCtxt.createGain(); gain.gain.setValueAtTime(0.25,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.22);
      osc.connect(gain); gain.connect(AudioCtxt.destination); osc.start(t); osc.stop(t+0.23); break;
    case 'eat':
      osc = AudioCtxt.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(520,t); osc.frequency.exponentialRampToValueAtTime(780,t+0.15);
      gain = AudioCtxt.createGain(); gain.gain.setValueAtTime(0.22,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.18);
      osc.connect(gain); gain.connect(AudioCtxt.destination); osc.start(t); osc.stop(t+0.2); break;
    case 'place':
      osc = AudioCtxt.createOscillator(); osc.type='triangle'; osc.frequency.setValueAtTime(180,t); osc.frequency.exponentialRampToValueAtTime(90,t+0.08);
      gain = AudioCtxt.createGain(); gain.gain.setValueAtTime(0.15,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      osc.connect(gain); gain.connect(AudioCtxt.destination); osc.start(t); osc.stop(t+0.12); break;
    case 'pill':
      [0,0.12,0.24].forEach(function(d,i){
        var o=AudioCtxt.createOscillator(); o.type='sine';
        o.frequency.setValueAtTime(440+i*220,t+d); o.frequency.exponentialRampToValueAtTime(880+i*220,t+d+0.15);
        var g=AudioCtxt.createGain(); g.gain.setValueAtTime(0.2,t+d); g.gain.exponentialRampToValueAtTime(0.001,t+d+0.18);
        o.connect(g); g.connect(AudioCtxt.destination); o.start(t+d); o.stop(t+d+0.2);
      }); break;
    case 'boss':
      osc = AudioCtxt.createOscillator(); osc.type='sawtooth'; osc.frequency.setValueAtTime(60,t); osc.frequency.linearRampToValueAtTime(180,t+0.6);
      gain = AudioCtxt.createGain(); gain.gain.setValueAtTime(0.3,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.7);
      osc.connect(gain); gain.connect(AudioCtxt.destination); osc.start(t); osc.stop(t+0.72); break;
    case 'win':
      [523,659,784,1046].forEach(function(f,i){
        var o=AudioCtxt.createOscillator(); o.type='triangle';
        o.frequency.setValueAtTime(f,t+i*0.14);
        var g=AudioCtxt.createGain(); g.gain.setValueAtTime(0.22,t+i*0.14); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.14+0.3);
        o.connect(g); g.connect(AudioCtxt.destination); o.start(t+i*0.14); o.stop(t+i*0.14+0.32);
      }); break;
    case 'death':
      [440,330,220,110].forEach(function(f,i){
        var o=AudioCtxt.createOscillator(); o.type='sawtooth';
        o.frequency.setValueAtTime(f,t+i*0.1);
        var g=AudioCtxt.createGain(); g.gain.setValueAtTime(0.2,t+i*0.1); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.25);
        o.connect(g); g.connect(AudioCtxt.destination); o.start(t+i*0.1); o.stop(t+i*0.1+0.27);
      }); break;
    case 'click':
      osc = AudioCtxt.createOscillator(); osc.type='square'; osc.frequency.setValueAtTime(800,t);
      gain = AudioCtxt.createGain(); gain.gain.setValueAtTime(0.1,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.05);
      osc.connect(gain); gain.connect(AudioCtxt.destination); osc.start(t); osc.stop(t+0.06); break;
  }
}

/* ========== 工具 ========== */
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function dist(ax,ay,bx,by){var dx=bx-ax,dy=by-ay;return Math.sqrt(dx*dx+dy*dy);}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function hashStr(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(seed){return function(){var t=seed=(seed+0x6D2B79F5)>>>0;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function valueNoise2D(seed){
  var r = mulberry32(seed);
  var perm = new Uint16Array(512);
  for (var i=0;i<512;i++) perm[i] = Math.floor(r()*512);
  function grad(ix,iy){var h=perm[(ix*73856093^iy*19351301)&511]&7;var v=(h<4?1:-1)*(h&1?1:2);return v;}
  function fade(t){return t*t*t*(t*(t*6-15)+10);}
  return function(x,y){
    var xi=Math.floor(x), yi=Math.floor(y);
    var xf=x-xi, yf=y-yi;
    var u=fade(xf), v=fade(yf);
    var a=grad(xi,yi), b=grad(xi+1,yi), c=grad(xi,yi+1), d=grad(xi+1,yi+1);
    return lerp(lerp(a,b,u), lerp(c,d,u), v);
  };
}

/* ========== 常量 ========== */
var TILE = 22;
var WORLD_W = 560;        // 横向 560 块（加大地图）
var WORLD_H = 160;        // 纵向 160 块
var SKY_H = 55;           // 地表大约高度
var GRAV = 26;            // 重力（块/秒²）
var MAX_FALL = 38;        // 最大下落速度
var JUMP_V = 9.2;
var WALK_V = 5.2;
var RUN_V = 8.4;
var REACH = 5.2;          // 玩家挖掘半径（块）
var DAY_LEN = 240;        // 一天秒数（实时）
var DROWN_TIME = 12;      // 氧气耗尽秒数

/* ========== 方块定义 ========== */
// 0=空气 1=草地 2=泥土 3=石头 4=圆石 5=原木 6=树叶 7=木板 8=沙 9=沙岩
// 10=水 11=煤矿 12=铁矿 13=金矿 14=钻石矿 15=基岩 16=雪 17=冰 18=仙人掌
// 19=南瓜 20=砖 21=玻璃 22=苔石 23=蘑菇块 24=葫芦 25=炼丹炉 26=玉柱
// 27=月宫砖 28=火把 29=云 30=花 31=金丹块 32=稻草 33=胡萝卜作物 34=小麦作物
// 35=天蓬砖(BOSS场地) 36=仙木桩 37=发光石
var B = {
  AIR:0, GRASS:1, DIRT:2, STONE:3, COBBLE:4, LOG:5, LEAVES:6, PLANK:7, SAND:8, SANDST:9,

var blockCache = {};

function shade(c,s){return 'rgb('+clamp(Math.round(c[0]*s),0,255)+','+clamp(Math.round(c[1]*s),0,255)+','+clamp(Math.round(c[2]*s),0,255)+')';}
function preRenderBlock(id){
  if (blockCache[id]) return blockCache[id];
  var c = document.createElement('canvas'); c.width=TILE; c.height=TILE;
  var g = c.getContext('2d'); g.imageSmoothingEnabled=false;
  drawBlockInto(g, id, 0, 0, TILE);

// 直接画一个方块到给定上下文（用于缓存与小图标）
function drawBlockInto(g, id, x, y, sz){
  var t = BLK[id]; if(!t) return;
  var def = COLOR_DEF[t.t] || COLOR_DEF.stone;
  // 主底
  g.fillStyle = def.base; g.fillRect(x,y,sz,sz);
  // 顶部亮带
  g.fillStyle = def.top; g.fillRect(x,y,sz,Math.max(2,sz*.16));
  // 阴影底
  g.fillStyle = def.shade; g.fillRect(x,y+sz-Math.max(2,sz*.16),sz,Math.max(2,sz*.16));
  // 纹理点
  if (def.dots){
    g.fillStyle = def.dots;
    for (var i=0;i<def.dotsN;i++){
      var dx = x+(((i*53)%sz|0)), dy = y+(((i*97)%sz|0));
      g.fillRect(dx,dy,2,2);
    }
  }
  if (def.lines){
    g.strokeStyle = def.lines; g.lineWidth=1;
    g.strokeRect(x+.5,y+.5,sz-1,sz-1);
  }
  // 特殊：火把
  if (id===B.TORCH){
    g.fillStyle='#6b4a1e'; g.fillRect(x+sz/2-1,y+sz*.3,2,sz*.7);
    g.fillStyle='#ffd76b'; g.beginPath(); g.arc(x+sz/2,y+sz*.25,sz*.18,0,7); g.fill();
    g.fillStyle='#ff8a30'; g.beginPath(); g.arc(x+sz/2,y+sz*.25,sz*.1,0,7); g.fill();
  } else if (id===B.FLOWER){
    g.fillStyle='#3a8a2e'; g.fillRect(x+sz/2-1,y+sz*.3,2,sz*.7);
    g.fillStyle='#ff6aa0'; for(var p=0;p<5;p++){var a=p/5*6.28;g.beginPath();g.arc(x+sz/2+Math.cos(a)*sz*.2,y+sz*.3+Math.sin(a)*sz*.2,sz*.1,0,7);g.fill();}
    g.fillStyle='#ffd76b'; g.beginPath();g.arc(x+sz/2,y+sz*.3,sz*.08,0,7);g.fill();
  } else if (id===B.CARROT||id===B.WHEAT){
    g.fillStyle=id===B.CARROT?'#ff8a30':'#e8c455';
    g.fillRect(x+sz*.4,y+sz*.2,sz*.2,sz*.7);
    g.fillStyle='#3a8a2e'; g.fillRect(x+sz*.25,y+sz*.5,sz*.5,sz*.15);
  } else if (id===B.PILBLK){
    g.fillStyle='#ffd76b'; g.beginPath(); g.arc(x+sz/2,y+sz/2,sz*.32,0,7); g.fill();
    g.strokeStyle='#c8731c'; g.lineWidth=2; g.beginPath(); g.arc(x+sz/2,y+sz/2,sz*.32,0,7); g.stroke();
    g.fillStyle='#fff'; g.font='bold '+(sz*.5)+'px sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('丹',x+sz/2,y+sz/2+1);
  } else if (id===B.TIAN){
    g.fillStyle='#fff'; g.font='bold '+(sz*.55)+'px sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('蓬',x+sz/2,y+sz/2);
  }
}

  {out:{id:'apple_g',n:1}, in:[{id:'apple',n:2},{id:'gold',n:1}]},
  {out:{id:'b'+B.CLOUD,n:4}, in:[{id:'cloud_e',n:1}]}
];
function canCraft(r,inv){
  for (var i=0;i<r.in.length;i++){if(countItem(inv,r.in[i].id)<r.in[i].n) return false;}
  return true;
}
function countItem(inv,id){var n=0;for(var i=0;i<inv.length;i++){if(inv[i]&&inv[i].id===id)n+=inv[i].n;}return n;}
function removeItem(inv,id,n){
  for (var i=0;i<inv.length;i++){if(inv[i]&&inv[i].id===id){var t=Math.min(n,inv[i].n);inv[i].n-=t;n-=t;if(inv[i].n<=0)inv[i]=null;if(n<=0)return;}}
  updateHotbar();
}
function addItem(inv,id,n){
  n=n||1;
  for (var i=0;i<inv.length && n>0;i++){
    if (inv[i] && inv[i].id===id && inv[i].n<IT[id].stack){var t=Math.min(n,IT[id].stack-inv[i].n);inv[i].n+=t;n-=t;}
  }
  for (var i=0;i<inv.length && n>0;i++){
    if (!inv[i]){var t=Math.min(n,IT[id].stack);inv[i]={id:id,n:t};n-=t;}
  }
  updateHotbar();
}

/* ========== 世界 ========== */
var World = {
  W:WORLD_W, H:WORLD_H, seed:0,
  blocks:null, walls:null, light:null, // Uint8Array block ids, walls (background), light 0-15
  surfaceY:null, biom:null, // surfaceY[i], biome string per column
  pillAt:null, // [x,y] of 9 pill pedestals
  structures:[], // {type,x,y}
  cleared:[],    // cleared ruin (got pill)
  name:''
};
function WIDX(x,y){return y*World.W+x;}

var BIOMES = {
  forest:'青翠林', desert:'黄沙海', snow:'寒冰原', mush:'紫云泽', sky:'云上天'
};
// Voronoi 群系：每个群系一个随机中心点，按距离最近分配
function precomputeBiomes(){
  if (World.biomPrecomputed) return;
  World.biomPrecomputed = true;
  var biomeList = ['forest','desert','snow','mush'];
  var rng = mulberry32(World.seed ^ 0xB109);
  // 4 个中心点，均匀分布在 World.W 范围内（留点边距）
  var centers = [];
  for (var i=0;i<biomeList.length;i++){
    var cx = Math.floor(World.W * (i+0.5) / biomeList.length + rng()*(World.W/biomeList.length)*0.6 - World.W/biomeList.length*0.3);
    cx = clamp(cx, 30, World.W-30);
    centers.push({x:cx, type:biomeList[i]});
  }
  // 打乱中心点与群系的对应关系，让位置随机
  for (var i=centers.length-1;i>0;i--){
    var j = Math.floor(rng()*(i+1));
    var tmp = centers[i].type; centers[i].type = centers[j].type; centers[j].type = tmp;
  }
  // 填充每个 x 的群系
  var n = valueNoise2D(World.seed ^ 0xC0FE);
  for (var x=0;x<World.W;x++){
    var best = 0, bestD = Infinity;
    for (var c=0;c<centers.length;c++){
      var dd = (x - centers[c].x) * (x - centers[c].x);
      if (dd < bestD){ bestD = dd; best = c; }
    }
    // 加一点噪声让边界不是硬直线（±3 格抖动）
    var jitter = Math.floor(n(x*0.04, 0) * 3);
    World.biom[x] = centers[best].type;
    // 抖动附近几个格子的群系（产生自然过渡）
    if (jitter !== 0){
      var nx = x + jitter;
      if (nx>=0 && nx<World.W) World.biom[nx] = centers[best].type;
    }
  }
  // 确保地图首尾不出现空群系（以防抖动导致的空洞）
  if (!World.biom[0]) World.biom[0] = 'forest';
  if (!World.biom[World.W-1]) World.biom[World.W-1] = 'forest';
}
function getBiome(x){
  if (!World.biomPrecomputed) precomputeBiomes();
  if (!World.biom[x]) World.biom[x] = 'forest';
  return World.biom[x];
}
// 各遗迹对应的允许群系
var RUIN_BIOMES = {
  temple:   ['forest','mush'],
  mine:     ['forest','desert','snow','mush'],
  village:  ['forest'],
  gourd:    ['forest','mush'],
  furnace:  ['forest','desert','snow','mush'],
  pyramid:  ['desert'],
  icepalace:['snow'],
  moon:     ['forest','desert','snow','mush'],
  jade:     ['forest','mush']
};

// 生成完整世界
function generateWorld(seedStr){
  var seed = hashStr(seedStr);
  World.seed = seed;
  World.biomPrecomputed = false;
  var rng = mulberry32(seed);
  var noise = valueNoise2D(seed);
  var caveNoise = valueNoise2D(seed^0x55);
  var oreNoise = valueNoise2D(seed^0xa5);
  World.biom = new Array(World.W);
  World.blocks = new Uint8Array(World.W*World.H);
  World.walls = new Uint8Array(World.W*World.H);
  World.light = new Float32Array(World.W*World.H);
  World.surfaceY = new Int16Array(World.W);
  World.pillAt = [];
  World.structures = [];
  World.cleared = [];

  // 1. 基岩与基本地形
  for (var x=0;x<World.W;x++){
    var b = getBiome(x);
    // 高度噪声（幅度大幅降低→地形更平缓）
    var h = noise(x*0.03, 0) * 4 + noise(x*0.08, 0.5)*2;
    var baseY = SKY_H + h;
    if (b==='desert') baseY += 1;
    if (b==='snow') baseY -= 0.5;
    if (b==='mush') baseY += 0.5;
    World.surfaceY[x] = Math.floor(baseY);
    var surf = Math.floor(baseY);
    for (var y=0;y<World.H;y++){
      var idx = WIDX(x,y);
      if (y===World.H-1 || (y>=World.H-4 && (rng()<0.5))) { World.blocks[idx]=B.BED; }
      else if (y < surf) { World.blocks[idx]=B.AIR; }
      else {
        var depth = y - surf;
        // 地表
        if (depth===0){
          if (b==='desert') World.blocks[idx]=B.SAND;
          else if (b==='snow') World.blocks[idx]=B.SNOW;
          else World.blocks[idx]=B.GRASS;
        } else if (depth<=3){
          if (b==='desert') World.blocks[idx]=B.SAND;
          else if (b==='snow') World.blocks[idx]=B.SNOW;
          else World.blocks[idx]=B.DIRT;
        } else {
          // 石头 + 洞穴 + 矿
          var cav = caveNoise(x*0.09, y*0.09);
          if (cav > 0.48 && y<World.H-5 && y>surf+2){
            World.blocks[idx]=B.AIR;
          } else if (cav > 0.43 && y>surf+8 && rng()<0.2){
            World.blocks[idx]=B.AIR;
          } else {
            var ore = oreNoise(x*0.13, y*0.13);
            // 矿石概率大幅降低（原来 ore>0.6 && rng<0.5 ≈ 20% → 现在 ore>0.78 && rng<0.2 ≈ 3%）
            if (y>surf+12 && ore>0.78 && rng()<0.2){
              if (y<surf+25) World.blocks[idx]=B.COAL;
              else if (y<surf+40) World.blocks[idx]= (rng()<0.6?B.COAL:B.IRON);
              else if (y<surf+55) World.blocks[idx]= (rng()<0.5?B.IRON:B.GOLD);
              else World.blocks[idx]= (rng()<0.3?B.GOLD:B.DIAM);
            } else {
              World.blocks[idx]=B.STONE;
            }
          }
        }
      }
      // 背景墙（只在深层填充）
      if (y >= surf+5) {
        World.walls[idx] = (y<surf+8)?B.STONE:B.STONE;
      }
    }
  }
  // 2. 水池：低洼处填水
  for (var x=2;x<World.W-2;x++){
    var sy = World.surfaceY[x];
    // 检测低洼
    var lsy = World.surfaceY[x-1], rsy = World.surfaceY[x+1];
    if (sy>lsy+2 && sy>rsy+2){
      for (var y=sy-1;y>sy-6 && y>0;y--){
        var idx=WIDX(x,y);
        if (World.blocks[idx]===B.AIR) World.blocks[idx]=B.WATER;
      }
    }
  }
  // 3. 沙漠下砂岩
  for (var x=0;x<World.W;x++){
    if (getBiome(x)!=='desert') continue;
    var sy=World.surfaceY[x];
    for (var y=sy+4;y<sy+8 && y<World.H;y++){
      if (World.blocks[WIDX(x,y)]===B.STONE) World.blocks[WIDX(x,y)]=B.SANDST;
    }
  }
  // 4. 雪原下冰
  for (var x=0;x<World.W;x++){
    if (getBiome(x)!=='snow') continue;
    var sy=World.surfaceY[x];
    for (var y=sy+1;y<sy+5 && y<World.H;y++){
      var i=WIDX(x,y);
      if (World.blocks[i]===B.DIRT||World.blocks[i]===B.STONE) World.blocks[i]=B.ICE;
    }
  }
  // 5. 地表装饰：树、花、仙人掌
  for (var x=2;x<World.W-2;x++){
    var sy = World.surfaceY[x];
    var b = getBiome(x);
    var top = World.blocks[WIDX(x,sy)];
    if (top===B.GRASS||top===B.SAND||top===B.SNOW){
      var rr = rng();
      if (b==='forest' && rr<0.18){ plantTree(x, sy, B.LOG, B.LEAVES, 4+rng()*3); }
      else if (b==='mush' && rr<0.16){ plantTree(x, sy, B.XLOG, B.MUSH, 5+rng()*3); }
      else if (b==='desert' && rr<0.08){ setBlk(x,sy-1,B.CACT); }
      else if (b==='snow' && rr<0.10){ setBlk(x,sy-1,B.ICE); }
      else if (b==='forest' && rr<0.25){ setBlk(x,sy-1,B.FLOWER); }
      else if (b==='desert' && rr<0.14){ setBlk(x,sy-1,B.PUMP); }
    }
  }
  // 6. 随机遗迹（9 处，每种遗迹只在对应群系生成，均匀分布全地图）
  var ruins = ['temple','mine','village','gourd','furnace','pyramid','icepalace','moon','jade'];
  // 打散
  for (var i=ruins.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=ruins[i];ruins[i]=ruins[j];ruins[j]=t;}
  // 给每个遗迹分配一个优先区域：全地图分成 9 块，每块一个遗迹，避免扎堆
  var zones = [];
  var zoneW = Math.floor(World.W / ruins.length);
  for (var i=0;i<ruins.length;i++) zones.push([i*zoneW + 15, (i+1)*zoneW - 15]);
  // 打乱区域顺序，避免遗迹类型固定对应地图位置
  for (var i=zones.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=zones[i];zones[i]=zones[j];zones[j]=t;}
  for (var i=0;i<ruins.length;i++){
    var allowed = RUIN_BIOMES[ruins[i]] || ['forest','desert','snow','mush'];
    var rx = -1, ry = -1;
    var zStart = zones[i][0], zEnd = zones[i][1];
    // 先在分配区域内搜索（最多 100 次）
    for (var attempt=0; attempt<100; attempt++){
      var cand = Math.floor(rng()*(zEnd - zStart)) + zStart;
      if (cand<10||cand>World.W-11) continue;
      var b = getBiome(cand);
      if (allowed.indexOf(b)>=0){
        rx = cand;
        ry = World.surfaceY[rx];
        var ok = true;
        for (var dy=1; dy<=3; dy++){
          if (getBlk(rx, ry-dy)===B.AIR) continue;
          ok = false; break;
        }
        if (ok) break else rx = -1;
      }
    }
    // 区域内找不到 → 放宽到全地图搜索
    if (rx < 0){
      for (var attempt=0; attempt<200; attempt++){
        var cand2 = Math.floor(rng()*(World.W-30)) + 15;
        var b2 = getBiome(cand2);
        if (allowed.indexOf(b2)>=0){
          rx = cand2; ry = World.surfaceY[rx];
          var ok2 = true;
          for (var dy=1; dy<=3; dy++){
            if (getBlk(rx, ry-dy)===B.AIR) continue;
            ok2 = false; break;
          }
          if (ok2) break else rx = -1;
        }
      }
    }
    if (rx < 0){ rx = Math.floor(World.W/2); ry = World.surfaceY[rx]; }
    buildRuin(ruins[i], rx, ry);
    World.structures.push({type:ruins[i], x:rx, y:ry});
  }
  // 7. 散落小遗迹 / 仙人掌丛 / 草地小屋
  for (var i=0;i<40;i++){
    var rx = Math.floor(rng()*World.W);
    var ry = World.surfaceY[rx] || SKY_H;
    var b = getBiome(rx);
    if (b==='desert' && rng()<0.4) setBlk(rx,ry-1,B.CACT);
    if (b==='forest' && rng()<0.3) plantTree(rx, ry, B.LOG, B.LEAVES, 3+rng()*2);
  }
  // 8. 计算初始光照
  recomputeLight();
}
function setBlk(x,y,id){ if(x<0||y<0||x>=World.W||y>=World.H) return; World.blocks[WIDX(x,y)]=id; }
function getBlk(x,y){ if(x<0||y<0||x>=World.W||y>=World.H) return B.BED; if(!World.blocks) return B.AIR; return World.blocks[WIDX(x,y)]; }
function setWall(x,y,id){ if(x<0||y<0||x>=World.W||y>=World.H) return; World.walls[WIDX(x,y)]=id; }
function getWall(x,y){ if(x<0||y<0||x>=World.W||y>=World.H) return 0; if(!World.walls) return 0; return World.walls[WIDX(x,y)]; }
function isSolid(id){ return id!==B.AIR && id!==B.WATER; }
function isLiquid(id){ return id===B.WATER; }
function isOpaque(id){ if (id===B.AIR) return false; var b=BLK[id]; return !b || !b.trans; }

function plantTree(x, surfY, log, leaf, h){
  var h = Math.floor(h);
  for (var i=1;i<=h;i++){ setBlk(x, surfY-i, log); }
  var top = surfY - h;
  for (var dx=-2;dx<=2;dx++) for (var dy=-1;dy<=2;dy++){
    if (Math.abs(dx)+Math.abs(dy)<=3) setBlk(x+dx, top-1+dy, leaf);
  }
  setBlk(x, top-3, leaf);
}

/* ===== 遗迹生成器 ===== */
function buildRuin(type, x, y){
  switch(type){
    case 'temple': ruinTemple(x,y); break;
    case 'mine': ruinMine(x,y); break;
    case 'village': ruinVillage(x,y); break;
    case 'gourd': ruinGourdTower(x,y); break;
    case 'furnace': ruinFurnace(x,y); break;
    case 'pyramid': ruinPyramid(x,y); break;
    case 'icepalace': ruinIcePalace(x,y); break;
    case 'moon': ruinMoonPalace(x,y); break;
    case 'jade': ruinJadePillar(x,y); break;
  }
}
function placePillPedestal(x,y){
  setBlk(x,y,B.PILBLK);
  World.pillAt.push([x,y]);
}
function ruinTemple(x,y){
  // 苔石神庙：底部宽 12 高 8
  for (var dx=-6;dx<=6;dx++) for (var dy=0;dy<8;dy++){
    if (dx===-6||dx===6||dy===0||dy===7){
      setBlk(x+dx,y-1-dy, B.MOSS);
    } else if ((dx+dy)%3===0){
      setBlk(x+dx,y-1-dy, B.MOSS);
    } else setBlk(x+dx,y-1-dy, B.AIR);
  }
  // 入口
  for (var dy=0;dy<3;dy++){ setBlk(x,y-1-dy,B.AIR); }
  // 内部金丹座
  placePillPedestal(x, y-5);
  // 石巨人守卫
  spawnMob('golem', (x)*TILE+TILE/2, (y-4)*TILE);
}
function ruinMine(x,y){
  // 矿洞：水平坑道 + 支撑木桩
  for (var dx=-8;dx<=8;dx++){
    setBlk(x+dx,y-3,B.COBBLE);
    setBlk(x+dx,y-2,B.AIR);
    setBlk(x+dx,y-1,B.AIR);
    setBlk(x+dx,y,B.AIR);
    setBlk(x+dx,y+1,B.COBBLE);
    if (dx%4===0){ setBlk(x+dx,y-3,B.PLANK); setBlk(x+dx,y+1,B.PLANK); setBlk(x+dx,y-2,B.LOG); }
  }
  // 散落矿石
  for (var dx=-7;dx<=7;dx+=2){
    var ry = y-2;
    if (Math.random()<0.4) setBlk(x+dx,y-3,B.IRON);
    if (Math.random()<0.3) setBlk(x+dx,y+1,B.COAL);
    if (Math.random()<0.15) setBlk(x+dx+1,y-2,B.GOLD);
  }
  placePillPedestal(x, y-3);
}
function ruinVillage(x,y){
  // 三间小木屋
  for (var h=-1;h<=1;h++){
    var cx = x + h*8;
    for (var dx=-3;dx<=3;dx++) for (var dy=0;dy<5;dy++){
      if (dx===-3||dx===3||dy===0||dy===4){ setBlk(cx+dx,y-1-dy,B.PLANK); }
      else setBlk(cx+dx,y-1-dy,B.AIR);
    }
    setBlk(cx,y-1,B.AIR); // 门
    setBlk(cx-2,y-3,B.GLASS); setBlk(cx+2,y-3,B.GLASS);
    // 屋顶
    for (var dx=-4;dx<=4;dx++) setBlk(cx+dx,y-6,B.XLOG);
    setBlk(cx,y-5,B.TORCH);
  }
  placePillPedestal(x, y-1);
}
function ruinGourdTower(x,y){
  // 葫芦塔：圆柱塔 + 顶部葫芦
  for (var dy=0;dy<10;dy++){
    setBlk(x-2,y-1-dy,B.GOURD); setBlk(x+2,y-1-dy,B.GOURD);
    setBlk(x-1,y-1-dy,B.AIR); setBlk(x,y-1-dy,B.AIR); setBlk(x+1,y-1-dy,B.AIR);
    if (dy%3===0){ setBlk(x,y-1-dy,B.TORCH); }
  }
  // 顶部葫芦
  for (var dx=-2;dx<=2;dx++) for (var dy=0;dy<3;dy++){
    if (Math.abs(dx)+dy<=3) setBlk(x+dx,y-11-dy,B.GOURD);
  }
  placePillPedestal(x, y-2);
  // 葫芦娃守卫
  spawnMob('gourdboy', x*TILE+TILE/2, (y-3)*TILE);
}
function ruinFurnace(x,y){
  // 炼丹炉遗迹：石台 + 炉
  for (var dx=-5;dx<=5;dx++) setBlk(x+dx,y-1,B.STONE);
  for (var dx=-3;dx<=3;dx++){ setBlk(x+dx,y-2,B.COBBLE); setBlk(x+dx,y-3,B.COBBLE); }
  setBlk(x,y-3,B.FURN);
  for (var dx=-2;dx<=2;dx++) setBlk(x+dx,y-4,B.AIR);
  // 烟囱
  for (var dy=0;dy<4;dy++) setBlk(x,y-4-dy,B.BRICK);
  placePillPedestal(x+3, y-1);
  placePillPedestal(x-3, y-1); // 这座给两颗?  设计上每遗迹一颗 -> 删掉
  World.pillAt.pop();
}
function ruinPyramid(x,y){
  // 沙漠金字塔
  var rows = 6;
  for (var r=0;r<rows;r++){
    var cnt = rows-r;
    var ry = y-1-r;
    for (var c=0;c<cnt;c++){
      var rx = x - Math.floor((cnt-1)/2) + c;
      setBlk(rx,ry,B.SANDST);
    }
  }
  // 内部空腔
  setBlk(x,y-3,B.AIR); setBlk(x,y-4,B.AIR);
  setBlk(x,y-2,B.AIR);
  placePillPedestal(x,y-3);
}
function ruinIcePalace(x,y){
  // 冰宫
  for (var dx=-5;dx<=5;dx++) for (var dy=0;dy<6;dy++){
    if (dx===-5||dx===5||dy===0||dy===5) setBlk(x+dx,y-1-dy,B.ICE);
    else setBlk(x+dx,y-1-dy,B.AIR);
  }
  setBlk(x,y-1,B.AIR); setBlk(x,y-2,B.AIR);
  for (var dx=-4;dx<=4;dx++) setBlk(x+dx,y-7,B.SNOW);
  setBlk(x,y-3,B.TORCH);
  placePillPedestal(x, y-4);
}
function ruinMoonPalace(x,y){
  // 月宫 (在高空)
  var py = y - 15;
  for (var dx=-6;dx<=6;dx++) for (var dy=0;dy<5;dy++){
    if (dx===-6||dx===6||dy===0||dy===4) setBlk(x+dx,py-1-dy,B.MOON);
    else setBlk(x+dx,py-1-dy,B.AIR);
  }
  // 月桂枝
  for (var dx=-5;dx<=5;dx++) setBlk(x+dx,py-6,B.MOON);
  for (var dx=-3;dx<=3;dx++){ setBlk(x+dx,py-7,B.LEAVES); }
  setBlk(x,py-1,B.AIR); setBlk(x,py-2,B.AIR);
  // 通往地面的柱子
  for (var dy=0;dy<14;dy++){ setBlk(x,py+1+dy,B.MOON); }
  placePillPedestal(x, py-2);
  // 仙人鸟
  spawnMob('bird', x*TILE+TILE/2, (py-3)*TILE);
}
function ruinJadePillar(x,y){
  // 通天玉柱：高耸玉柱
  var h = 18;
  for (var dy=0;dy<h;dy++){
    setBlk(x-2,y-1-dy,B.JADE); setBlk(x+2,y-1-dy,B.JADE);
    setBlk(x-1,y-1-dy,B.AIR); setBlk(x,y-1-dy,B.AIR); setBlk(x+1,y-1-dy,B.AIR);
    if (dy%4===0) setBlk(x,y-1-dy,B.TORCH);
  }
  // 顶部平台
  for (var dx=-3;dx<=3;dx++) setBlk(x+dx,y-1-h,B.JADE);
  for (var dx=-2;dx<=2;dx++) setBlk(x+dx,y-2-h,B.JADE);
  placePillPedestal(x, y-1-h);
}

/* ===== 光照 ===== */
function recomputeLight(){
  // 简化：天光从顶部下传到不透明方块；火把/发光块局部加亮
  for (var x=0;x<World.W;x++){
    var sky=1.0;
    for (var y=0;y<World.H;y++){
      var idx = WIDX(x,y);
      var id = World.blocks[idx];
      if (isOpaque(id)) sky = Math.max(0, sky-0.12);
      else if (id===B.WATER) sky = Math.max(0, sky-0.04);
      var base = sky;
      // 深度衰减
      var depth = y - World.surfaceY[x];
      if (depth>0) base = Math.max(base*0.9 - depth*0.005, 0.05);
      World.light[idx] = Math.max(base, 0);
    }
  }
  // 发光方块二次传播（小范围）
  for (var pass=0; pass<2; pass++){
    for (var y=0;y<World.H;y++) for (var x=0;x<World.W;x++){
      var idx = WIDX(x,y);
      var id = World.blocks[idx];
      var g = BLK[id] && BLK[id].glow ? BLK[id].glow : 0;
      if (g>0) World.light[idx] = Math.max(World.light[idx], g);
      // 向邻居弱传播
      if (World.light[idx]>0.2){
        var nb = [ [x-1,y],[x+1,y],[x,y-1],[x,y+1] ];
        for (var k=0;k<4;k++){
          var nx=nb[k][0], ny=nb[k][1];
          if (nx<0||ny<0||nx>=World.W||ny>=World.H) continue;
          var ni=WIDX(nx,ny);
          World.light[ni] = Math.max(World.light[ni], World.light[idx]*0.7);
        }
      }
    }
  }
}
function lightAt(x,y){ if(x<0||y<0||x>=World.W||y>=World.H) return 0.05; return World.light[WIDX(x,y)]; }

/* ===== 流体（简化水扩散） ===== */
var waterTicks = 0;
function tickWater(dt){
  waterTicks += dt;
  if (waterTicks < 0.25) return;
  waterTicks = 0;
  // 简单：水向下流，向下扩散
  // 为性能：只处理玩家附近
  var px = Math.floor(Player.x/TILE), py = Math.floor(Player.y/TILE);
  for (var dx=-40;dx<=40;dx++) for (var dy=-30;dy<=30;dy++){
    var x=px+dx, y=py+dy;
    if (x<0||y<0||x>=World.W||y>=World.H-1) continue;
    var i = WIDX(x,y);
    if (World.blocks[i]!==B.WATER) continue;
    var bi = WIDX(x,y+1);
    if (World.blocks[bi]===B.AIR){ World.blocks[bi]=B.WATER; World.blocks[i]=B.AIR; }
    else if (World.blocks[bi]===B.WATER || isSolid(World.blocks[bi])){
      var li = WIDX(x-1,y), ri = WIDX(x+1,y);
      if (World.blocks[li]===B.AIR) World.blocks[li]=B.WATER;
      if (World.blocks[ri]===B.AIR) World.blocks[ri]=B.WATER;
    }
  }
}

  invuln:0, breath:true, // 是否在水中
  inv: new Array(36), // 9 hotbar + 27 storage

  clearedRuins:0, pills:0,

};
function resetPlayer(){
  Player.hp=Player.maxHp; Player.hg=100; Player.st=100; Player.ox=100;
  Player.vx=0; Player.vy=0; Player.alive=true; Player.bossSpawned=false; Player.bossDefeated=false;
  Player.pills=0; Player.clearedRuins=0;
  Player.inv = new Array(36);
  // 开局空手：先撸树造工具
  Player.sel=0;
}
function spawnPlayer(){
  // 在世界中央地表，确保上方有空气（不是水也不是方块）
  var sx = Math.floor(World.W/2);
  var sy = World.surfaceY[sx];
  // 往上找到第一个 2 格连续 AIR
  for (var dy=0; dy<=20; dy++){
    if (getBlk(sx, sy-dy)===B.AIR && getBlk(sx, sy-dy-1)===B.AIR){
      Player.x = sx*TILE+TILE/2;
      Player.y = (sy-dy)*TILE;
      Player.vx=0; Player.vy=0;
      return;
    }
  }
  // fallback
  Player.x = sx*TILE+TILE/2;
  Player.y = (sy-2)*TILE;
  Player.vx=0; Player.vy=0;
}
function moveAndCollide(dt){
  // AABB 0.6 x 1.7 块
  var hw = TILE*0.3, hh = TILE*0.85;
  var x = Player.x, y = Player.y;
  // X 方向
  var nx = x + Player.vx * TILE * dt;
  if (!collideBox(nx, y, hw, hh)) Player.x = nx;
  else { Player.vx=0; }
  // Y 方向
  var ny = y + Player.vy * TILE * dt;
  Player.onGround=false;
  if (!collideBox(Player.x, ny, hw, hh)){
    Player.y = ny;
  } else {
    if (Player.vy>0){ Player.onGround=true; }
    Player.vy=0;
  }
  // 边界
  Player.x = clamp(Player.x, TILE, (World.W-1)*TILE);
  if (Player.y > (World.H)*TILE) damagePlayer(999, '坠入虚空');
  // 水中？
  var feet = Math.floor((Player.y+hh-2)/TILE);
  var cx = Math.floor(Player.x/TILE);
  var fblk = getBlk(cx, feet);
  Player.inWater = (fblk===B.WATER);
  if (Player.inWater){ Player.vy = clamp(Player.vy, -4, 4); }
}
function collideBox(cx, cy, hw, hh){
  // 检测 AABB 是否撞到固体方块
  var minX = Math.floor((cx-hw)/TILE), maxX = Math.floor((cx+hw)/TILE);
  var minY = Math.floor((cy-hh)/TILE), maxY = Math.floor((cy+hh)/TILE);
  for (var x=minX;x<=maxX;x++) for (var y=minY;y<=maxY;y++){
    if (isSolid(getBlk(x,y))) return true;
  }
  return false;
}
function damagePlayer(d, src){
  if (Player.invuln>0 || !Player.alive) return;
  Player.hp -= d;
  Player.invuln = 0.4;
  playSound('hit');
  toast('-'+d+' HP ['+(src||'?')+']', 1.2);
  if (Player.hp<=0){ Player.hp=0; Player.alive=false; playSound('death'); onPlayerDeath(src); }
}
function healPlayer(h){ Player.hp = clamp(Player.hp+h, 0, Player.maxHp); }

var Mobs = [];
function spawnMob(type, x, y){
  var def = MOB[type]; if(!def) return;
  // 安全检测：如果生成位置被方块或水挡住，往上挪直到有 AIR
  var tx = Math.floor(x/TILE), ty = Math.floor(y/TILE);
  var tries = 0;
  while (tries<15 && (getBlk(tx, ty)!==B.AIR || getBlk(tx, ty-1)!==B.AIR)){
    ty--; tries++;
  }
  x = tx*TILE + TILE/2;
  y = ty*TILE + TILE/2;
  var m = {type:type, def:def, x:x, y:y, vx:0, vy:0, onGround:false, facing:1,
           hp:def.hp, maxHp:def.hp, cd:0, target:null, ai:0, state:'idle',
           t:rnd(0,6.28), drops:def.drops, hostile:def.hostile, tamed:false, name:def.name};
  Mobs.push(m); return m;
}

function isFly(m){ return m.def.fly; }

function tickMobs(dt){
  for (var i=Mobs.length-1;i>=0;i--){
    var m = Mobs[i];
    if (!m.alive && m.alive!==undefined) { Mobs.splice(i,1); continue; }
    if (m.hp<=0){
      // 掉落
      if (m.drops){
        for (var k=0;k<m.drops.length;k++){
          var d = m.drops[k];
          if (Math.random()<d.ch) dropItem(d.id, d.n, m.x, m.y);
        }
      }
      // 石巨人击杀后，对应神庙的金丹座可被采集（不额外掉金丹）
      if (m.type==='golem'){
        toast('石巨人倒下，神庙金丹座已可采集', 2.5);
      }
      if (m.type==='boss'){ Player.bossDefeated=true; onBossDefeated(); }
      toast('击败 ' + m.def.name, 1.5);
      Mobs.splice(i,1);
      continue;
    }
    // 物理
    if (isFly(m)){
      m.vy = lerp(m.vy, 0, dt*2);
    } else {
      m.vy += GRAV * dt;
      m.vy = clamp(m.vy, -MAX_FALL, MAX_FALL);
    }
    // AI
    tickMobAI(m, dt);
    // 移动+碰撞
    moveMob(m, dt);
    // 攻击冷却
    if (m.cd>0) m.cd-=dt;
    if (m.hitFlash>0) m.hitFlash-=dt;
    // 掉出世界
    if (m.y > World.H*TILE+200) m.hp=0;
  }
}
function moveMob(m, dt){
  var hw = m.def.w/2, hh = m.def.h/2;
  var nx = m.x + m.vx * TILE * dt;
  if (!collideBox2(nx, m.y, hw, hh, m)) m.x = nx;
  else { m.vx = -m.vx*0.3; if (Math.abs(m.vx)<0.3) m.vx = 0; }
  var ny = m.y + m.vy * TILE * dt;
  m.onGround=false;
  if (!collideBox2(m.x, ny, hw, hh, m)) m.y = ny;
  else { if (m.vy>0) m.onGround=true; m.vy=0; }
  // 水：减速
  var cx = Math.floor(m.x/TILE), cy = Math.floor(m.y/TILE);
  if (getBlk(cx,cy)===B.WATER && !isFly(m)) m.vy = Math.min(m.vy, 2);
}
function collideBox2(cx, cy, hw, hh, m){
  var minX = Math.floor((cx-hw)/TILE), maxX = Math.floor((cx+hw)/TILE);
  var minY = Math.floor((cy-hh)/TILE), maxY = Math.floor((cy+hh)/TILE);
  for (var x=minX;x<=maxX;x++) for (var y=minY;y<=maxY;y++){
    if (isSolid(getBlk(x,y))) return true;
  }
  return false;
}
function tickMobAI(m, dt){
  m.t += dt;
  var def = m.def;
  // 玩家距离
  var dxp = Player.x - m.x, dyp = Player.y - m.y;
  var dpl = Math.sqrt(dxp*dxp+dyp*dyp);
  var aggro = (def.hostile || m.hostileAfter) && dpl < TILE*14;
  if (m.type==='boss') aggro = true;
  // 仙人鸟高空盘旋
  if (m.type==='bird'){
    if (m.target===null || m.t%4<0.1){ m.target = {x: m.x + rnd(-200,200), y: m.y + rnd(-100,100)}; }
    var dx = m.target.x - m.x, dy = m.target.y - m.y;
    m.vx = lerp(m.vx, clamp(dx*0.05, -def.speed, def.speed), dt*2);
    m.vy = lerp(m.vy, clamp(dy*0.05, -def.speed, def.speed), dt*2);
    return;
  }
  if (isFly(m)){
    // 飞剑：朝玩家飞
    if (aggro){
      m.vx = lerp(m.vx, clamp(dxp*0.05, -def.speed, def.speed), dt*2);
      m.vy = lerp(m.vy, clamp(dyp*0.05, -def.speed, def.speed), dt*2);
      m.facing = dxp<0?-1:1;
      if (dpl < TILE*1.0 && m.cd<=0){
        damagePlayer(def.dmg, '飞剑');
        m.cd = 1.2;
      }
    } else {
      m.vx = lerp(m.vx, Math.sin(m.t*1.2)*def.speed*0.5, dt*2);
      m.vy = lerp(m.vy, Math.cos(m.t*0.9)*def.speed*0.5, dt*2);
    }
    return;
  }
  // 地面生物
  if (m.type==='carrot'){
    // 见人就跑
    if (dpl < TILE*6 && Player.alive){
      m.vx = (dxp<0?1:-1) * def.speed * 1.2;
      m.facing = m.vx<0?1:-1;
    } else {
      // 漫游
      if (m.t%3<0.1){ m.vx = rnd(-1,1)*def.speed*0.5; m.facing = m.vx<0?-1:1; }
    }
  } else if (m.type==='pig'){
    if (m.t%3<0.1){ m.vx = rnd(-1,1)*def.speed*0.5; m.facing = m.vx<0?-1:1; }
    if (aggro && dpl<TILE*5){
      // 被攻击后逃跑
      m.vx = (dxp<0?1:-1)*def.speed;
    }
    if (dpl<TILE*1.0 && m.cd<=0 && m.hostileAfter){
      damagePlayer(def.dmg||4, m.name); m.cd=1;
    }
  } else if (m.type==='gourdboy'){
    if (aggro){
      m.vx = (dxp<0?-1:1)*def.speed;
      m.facing = m.vx<0?-1:1;
      if (m.onGround && Math.abs(dxp)<TILE*6 && Math.random()<0.02) m.vy=-JUMP_V*1.4;
      if (dpl<TILE*1.2 && m.cd<=0){ damagePlayer(def.dmg, m.name); m.cd=1.0; }
    } else {
      if (m.t%3<0.1){ m.vx = rnd(-1,1)*def.speed*0.5; m.facing = m.vx<0?-1:1; }
    }
  } else if (m.type==='golem'){
    if (aggro){
      m.vx = (dxp<0?-1:1)*def.speed;
      m.facing = m.vx<0?-1:1;
      if (dpl<TILE*2.0 && m.cd<=0){ damagePlayer(def.dmg, m.name+' 重拳'); m.cd=1.6; }
    } else {
      if (m.t%4<0.1){ m.vx = rnd(-1,1)*def.speed*0.4; m.facing = m.vx<0?-1:1; }
    }
  } else if (m.type==='boss'){
    // BOSS 三阶段
    var phase = m.hp/m.maxHp;
    if (aggro || dpl<TILE*30){
      m.vx = (dxp<0?-1:1)*def.speed*(phase<0.5?1.5:1);
      m.facing = m.vx<0?-1:1;
      if (m.onGround && Math.abs(dxp)<TILE*10 && (Math.random()<0.03 || phase<0.4)) m.vy=-JUMP_V*1.5;
      if (dpl<TILE*2.5 && m.cd<=0){ damagePlayer(def.dmg, '天蓬元帅·九齿钉耙'); m.cd=1.0; }
      // 远程：吐出葫芦娃
      if (m.cd2===undefined) m.cd2=0;
      m.cd2 -= dt;
      if (m.cd2<=0 && phase<0.7){
        var baby = spawnMob('gourdboy', m.x+m.facing*TILE*1.5, m.y-TILE);
        baby.hostileAfter=true;
        m.cd2 = 8;
      }
    }
  }
  // 朝向：以 vx 为准
  if (m.vx>0.1) m.facing=1; else if (m.vx<-0.1) m.facing=-1;
}

function dropItem(id, n, x, y){
  DroppedItems.push({id:id, n:n, x:x, y:y, vx:rnd(-2,2), vy:-4, t:0, life:120, pickup:0.5});
}
function tickDrops(dt){
  for (var i=DroppedItems.length-1;i>=0;i--){
    var d = DroppedItems[i];
    d.t += dt; d.pickup -= dt; d.life -= dt;
    if (d.life<=0){ DroppedItems.splice(i,1); continue; }
    // 物理
    d.vy += GRAV*dt*0.8;
    d.vy = clamp(d.vy, -MAX_FALL, MAX_FALL);
    var nx = d.x + d.vx*TILE*dt;
    if (!isSolid(getBlk(Math.floor(nx/TILE), Math.floor(d.y/TILE)))) d.x = nx;
    else d.vx = -d.vx*0.3;
    var ny = d.y + d.vy*TILE*dt;
    if (!isSolid(getBlk(Math.floor(d.x/TILE), Math.floor(ny/TILE)))) d.y = ny;
    else d.vy = 0;
    // 拾取
    if (d.pickup<=0){
      var dxp = Player.x - d.x, dyp = Player.y - d.y;
      if (dxp*dxp+dyp*dyp < TILE*1.6*TILE*1.6){
        addItem(Player.inv, d.id, d.n);
        toast('获得 '+(IT[d.d]?IT[d.d].n:IT[d.id].n)+' ×'+d.n, 0.8);
        DroppedItems.splice(i,1);
      }
      // 吸附
      if (dxp*dxp+dyp*dyp < TILE*3*TILE*3){
        d.vx += dxp*0.04; d.vy += dyp*0.04;
      }
    }
  }
}

var spawnCd = 0;
function tickSpawning(dt){
  spawnCd -= dt;
  if (spawnCd>0) return;
  spawnCd = 4;
  // 夜晚刷新敌对
  var night = (Clock.t<0.25 || Clock.t>0.75);
  var px = Math.floor(Player.x/TILE), py = Math.floor(Player.y/TILE);
  var count = Mobs.length;
  if (night && count<14){
    for (var i=0;i<2;i++){
      var dx = (Math.random()<0.5?-1:1)*rnd(20,40);
      var x = clamp(px+dx, 2, World.W-2);
      var y = World.surfaceY[x]-2;
      spawnMob('sword', x*TILE+TILE/2, y*TILE);
    }
  }
  // 白天刷新被动生物（控制总数）
  if (!night && count<10){
    for (var i=0;i<2;i++){
      var dx = (Math.random()<0.5?-1:1)*rnd(15,40);
      var x = clamp(px+dx, 2, World.W-2);
      var y = World.surfaceY[x]-2;
      var b = getBiome(x);
      if (b==='forest' || b==='mush'){
        if (Math.random()<0.5) spawnMob('pig', x*TILE+TILE/2, y*TILE);
        else if (b==='mush') spawnMob('carrot', x*TILE+TILE/2, y*TILE);
      } else if (b==='snow' || b==='desert'){
        if (Math.random()<0.3) spawnMob('carrot', x*TILE+TILE/2, y*TILE);
      }
    }
  }
}

/* ========== 时钟 ========== */
var Clock = { day:1, t:0.25 }; // t: 0-1, 0=午夜, 0.25=日出, 0.5=正午, 0.75=日落
function tickClock(dt){
  Clock.t += dt / DAY_LEN;
  if (Clock.t>=1){ Clock.t-=1; Clock.day++; toast('第 '+Clock.day+' 天', 2); }
}
function ambientLight(){
  // 0..1
  var t = Clock.t;
  // 白天高，夜晚低
  var day = 0;
  if (t<0.5) day = clamp((t-0.2)/0.1*0.8+0.2, 0, 1) - clamp((0.5-t)/5,0,0);
  // 用平滑函数
  var v;
  if (t<0.2) v=0.05;
  else if (t<0.3) v=lerp(0.05, 1.0, (t-0.2)/0.1);
  else if (t<0.7) v=1.0;
  else if (t<0.8) v=lerp(1.0, 0.05, (t-0.7)/0.1);
  else v=0.05;
  return v;
}

/* ========== 输入 ========== */
var Keys = {};
var Mouse = {x:0, y:0, wx:0, wy:0, left:false, right:false};
function bindInput(){
  window.addEventListener('keydown', function(e){
    Keys[e.code]=true;
    if (e.code==='KeyE'){ toggleInv(); }
    else if (e.code==='KeyC'){ toggleCraft(); }
    else if (e.code==='Escape'){ togglePause(); }
    else if (e.code>='Digit1' && e.code<='Digit9'){
      Player.sel = parseInt(e.code.slice(5))-1;
      updateHotbar();
    }
  });
  window.addEventListener('keyup', function(e){ Keys[e.code]=false; });
  var cv = document.getElementById('cv');
  function relPos(e){
    var r = cv.getBoundingClientRect();
    var sx = (e.clientX - r.left) * (cv.width / r.width);
    var sy = (e.clientY - r.top) * (cv.height / r.height);
    return {x:sx, y:sy};
  }
  cv.addEventListener('mousemove', function(e){
    var p = relPos(e); Mouse.x=p.x; Mouse.y=p.y;
    updateMouseWorld();
  });
  cv.addEventListener('mousedown', function(e){
    e.preventDefault();
    var p = relPos(e); Mouse.x=p.x; Mouse.y=p.y; updateMouseWorld();
    if (e.button===0) Mouse.left=true;
    if (e.button===2) Mouse.right=true;
  });
  cv.addEventListener('mouseup', function(e){
    if (e.button===0) Mouse.left=false;
    if (e.button===2) Mouse.right=false;
  });
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  cv.addEventListener('wheel', function(e){
    Player.sel = (Player.sel + (e.deltaY>0?1:-1) + 9) % 9;
    updateHotbar();
    e.preventDefault();
  });
  // 移动端检测：pointer: coarse 或宽度 < 900
  var isTouch = matchMedia('(pointer: coarse)').matches || CanvasW < 900;
  if (isTouch) setupTouchControls();
}

/* ========== 移动端虚拟摇杆与按钮 ========== */
var TouchState = { left:false, right:false, jumpQueued:false, mine:false, place:false, mouseOffsetX:0, mouseOffsetY:0 };
function setupTouchControls(){
  var el = document.getElementById('touchCtrl');
  el.classList.add('on');
  var stick = document.getElementById('stick');
  var knob = document.getElementById('stickKnob');
  var maxR = Math.min(stick.clientWidth, stick.clientHeight)/2 - 10;
  var activeStickId = null;

  function onStickDown(e){
    e.preventDefault(); e.stopPropagation();
    var t = e.touches ? e.touches[0] : e;
    activeStickId = t.identifier || 'mouse';
    moveStick(t);
  }
  function moveStick(t){
    var rect = stick.getBoundingClientRect();
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    var dx = t.clientX - cx, dy = t.clientY - cy;
    var d = Math.sqrt(dx*dx+dy*dy);
    if (d > maxR){ dx = dx/d*maxR; dy = dy/d*maxR; d = maxR; }
    knob.style.transform = 'translate('+dx+'px,'+dy+'px)';
    var ax = dx/maxR, ay = dy/maxR;
    Keys['KeyA'] = ax < -0.3;
    Keys['KeyD'] = ax > 0.3;
    Keys['KeyW'] = ay < -0.5;
    // 触摸指针映射到鼠标（用于挖掘/放置）
    Mouse.x = t.clientX - rect.left - rect.width;
    Mouse.y = t.clientY - rect.top - rect.height;
    TouchState.mouseOffsetX = cx + dx*2 - Camera.x;
    TouchState.mouseOffsetY = cy + dy*2 - Camera.y;
  }
  function resetStick(){
    activeStickId = null;
    knob.style.transform = 'translate(0,0)';
    Keys['KeyA'] = false; Keys['KeyD'] = false; Keys['KeyW'] = false;
  }
  stick.addEventListener('touchstart', onStickDown, {passive:false});
  stick.addEventListener('touchmove', function(e){
    if (activeStickId===null){ onStickDown(e); return; }
    for (var i=0;i<e.touches.length;i++){
      if (e.touches[i].identifier===activeStickId){ e.preventDefault(); moveStick(e.touches[i]); break; }
    }
  }, {passive:false});
  stick.addEventListener('touchend', function(e){
    for (var i=0;i<e.changedTouches.length;i++){
      if (e.changedTouches[i].identifier===activeStickId){ resetStick(); break; }
    }
  });
  // 触摸画布来旋转挖掘目标位置
  var cv = document.getElementById('cv');
  cv.addEventListener('touchmove', function(e){
    for (var i=0;i<e.touches.length;i++){
      var t = e.touches[i];
      // 避开摇杆手指（摇杆有 activeStickId）
      if (t.identifier===activeStickId) continue;
      var r = cv.getBoundingClientRect();
      Mouse.x = (t.clientX - r.left) * (cv.width/r.width);
      Mouse.y = (t.clientY - r.top) * (cv.height/r.height);
      updateMouseWorld();
    }
  }, {passive:true});

  // 跳跃按钮
  var tjump = document.getElementById('tJump');
  tjump.addEventListener('touchstart', function(e){ e.preventDefault(); Keys['Space']=true; }, {passive:false});
  tjump.addEventListener('touchend', function(e){ e.preventDefault(); Keys['Space']=false; });
  // 挖掘按钮（映射鼠标左键）
  var tmine = document.getElementById('tMine');
  tmine.addEventListener('touchstart', function(e){ e.preventDefault(); Mouse.left=true; }, {passive:false});
  tmine.addEventListener('touchend', function(e){ e.preventDefault(); Mouse.left=false; });
  // 放置按钮（映射鼠标右键）
  var tplace = document.getElementById('tPlace');
  tplace.addEventListener('touchstart', function(e){ e.preventDefault(); Mouse.right=true; }, {passive:false});
  tplace.addEventListener('touchend', function(e){ e.preventDefault(); Mouse.right=false; });
}
function updateMouseWorld(){
  // canvas 坐标 -> 世界坐标
  Mouse.wx = Mouse.x / CanvasScale + Camera.x;
  Mouse.wy = Mouse.y / CanvasScale + Camera.y;
}

/* ========== 摄像机 ========== */
var Camera = {x:0, y:0};
function updateCamera(dt){
  var vw = CanvasW/CanvasScale, vh = CanvasH/CanvasScale;
  var tx = Player.x - vw/2;
  var ty = Player.y - vh/2;
  // 限制
  tx = clamp(tx, 0, World.W*TILE - vw);
  ty = clamp(ty, 0, World.H*TILE - vh);
  Camera.x = lerp(Camera.x, tx, clamp(dt*6, 0, 1));
  Camera.y = lerp(Camera.y, ty, clamp(dt*6, 0, 1));
}

/* ========== 画布 ========== */
var Canvas, Ctx, CanvasW=0, CanvasH=0, CanvasScale=1;
function fitCanvas(){
  var cv = document.getElementById('cv');
  var f = document.getElementById('frame');
  var w = f.clientWidth, h = f.clientHeight;
  // CanvasScale 越大=视野越小（方块越大、可见范围越小）
  var scale = Math.max(1.5, Math.min(3, Math.floor(Math.min(w/960, h/540)*2)/2));
  CanvasW = w; CanvasH = h;
  cv.width = w; cv.height = h;
  CanvasScale = scale;
  Ctx = cv.getContext('2d');
  Ctx.imageSmoothingEnabled = false;
}

/* ========== 渲染 ========== */
function render(){
  var g = Ctx;
  // 世界尚未初始化时（主菜单）只画深色底
  if (!World.blocks){
    if (!g) return;
    var grad = g.createLinearGradient(0,0,0,CanvasH);
    grad.addColorStop(0, '#1a2440'); grad.addColorStop(1,'#2a3050');
    g.fillStyle = grad; g.fillRect(0,0,CanvasW,CanvasH);
    return;
  }
  var cw = CanvasW, ch = CanvasH;
  // 天空渐变（取决于昼夜）
  var amb = ambientLight();
  var top = blend([10,16,32], [110,180,235], amb);
  var bot = blend([40,30,50], [200,225,255], amb);
  var grad = g.createLinearGradient(0,0,0,ch);
  grad.addColorStop(0, rgb(top));
  grad.addColorStop(1, rgb(bot));
  g.fillStyle = grad; g.fillRect(0,0,cw,ch);
  // 太阳/月亮
  var t = Clock.t;
  var sx = cw*(t*1.4 - 0.2);
  var sy = ch*0.25 + Math.sin(t*6.28)*-60;
  if (t>0.2 && t<0.8){
    g.fillStyle = amb>0.5?'#fff3a0':'#ffd070';
    g.beginPath(); g.arc(sx, sy, 26, 0, 7); g.fill();
  } else {
    g.fillStyle = '#e8e8d8';
    g.beginPath(); g.arc(cw*(t<0.5?t+0.5:t-0.5)*1.4-0.2, sy, 22, 0, 7); g.fill();
    g.fillStyle = rgb(top);
    g.beginPath(); g.arc(cw*(t<0.5?t+0.5:t-0.5)*1.4-0.2+8, sy-4, 18, 0, 7); g.fill();
  }
  // 远景星星（夜晚）
  if (amb<0.4){
    g.fillStyle = 'rgba(255,255,255,'+(0.5-amb)+')';
    var rng = mulberry32(42);
    for (var i=0;i<60;i++){
      var ssx = rng()*cw, ssy = rng()*ch*0.5;
      g.fillRect(ssx, ssy, 2, 2);
    }
  }
  // 远山剪影
  g.fillStyle = blendRgb([20,30,50],[120,160,140], amb*0.7);
  g.beginPath();
  g.moveTo(0, ch*0.7);
  var rng2 = mulberry32(7);
  for (var x=0;x<=cw;x+=40){
    var yy = ch*0.7 - 60 + Math.sin(x*0.01+1.3)*30 + rng2()*20;
    g.lineTo(x, yy);
  }
  g.lineTo(cw, ch); g.lineTo(0, ch); g.closePath(); g.fill();

  // 方块层
  var scale = CanvasScale;
  var ts = TILE;
  var x0 = Math.floor(Camera.x/ts), x1 = Math.ceil((Camera.x+cw/scale)/ts);
  var y0 = Math.floor(Camera.y/ts), y1 = Math.ceil((Camera.y+ch/scale)/ts);
  x0=clamp(x0,0,World.W-1); x1=clamp(x1,0,World.W-1);
  y0=clamp(y0,0,World.H-1); y1=clamp(y1,0,World.H-1);
  // 1. 背景墙（只在前景为空时显示，避免挖掉方块后露出"无实体石头"）
  for (var y=y0;y<=y1;y++) for (var x=x0;x<=x1;x++){
    var id = getWall(x,y);
    if (id===0) continue;
    // 前景有方块就不画背景（前景盖着的时候背景完全没必要画）
    if (getBlk(x,y)!==B.AIR) continue;
    var cv = blockCache[id]; if (!cv) preRenderBlock(id);
    var sx = (x*ts - Camera.x)*scale;
    var sy = (y*ts - Camera.y)*scale;
    g.globalAlpha = 0.3;  // 半透明度降低，洞穴质感但不抢眼
    g.drawImage(blockCache[id]||preRenderBlock(id), sx, sy, ts*scale, ts*scale);
    g.globalAlpha = 1;
  }
  // 2. 前景方块
  for (var y=y0;y<=y1;y++) for (var x=x0;x<=x1;x++){
    var id = getBlk(x,y);
    if (id===B.AIR) continue;
    var cv = blockCache[id]; if (!cv) preRenderBlock(id);
    var sx = (x*ts - Camera.x)*scale;
    var sy = (y*ts - Camera.y)*scale;
    g.drawImage(blockCache[id]||preRenderBlock(id), sx, sy, ts*scale, ts*scale);
  }
  // 3. 水波动效果（叠加）
  for (var y=y0;y<=y1;y++) for (var x=x0;x<=x1;x++){
    var id = getBlk(x,y);
    if (id!==B.WATER) continue;
    var sx = (x*ts - Camera.x)*scale;
    var sy = (y*ts - Camera.y)*scale;
    g.fillStyle = 'rgba(120,180,255,0.18)';
    var wave = Math.sin((Clock.t*100+x)*2)*1;
    g.fillRect(sx, sy+wave, ts*scale, ts*scale);
  }
  // 4. 光照遮罩
  var ambL = ambientLight();
  for (var y=y0;y<=y1;y++) for (var x=x0;x<=x1;x++){
    var id = getBlk(x,y);
    var l = lightAt(x,y);
    var eff = Math.min(1, l*0.6 + ambL*0.7);
    if (eff>=0.98) continue;
    var sx = (x*ts - Camera.x)*scale;
    var sy = (y*ts - Camera.y)*scale;
    g.fillStyle = 'rgba(0,0,8,'+(1-eff)+')';
    g.fillRect(sx, sy, ts*scale, ts*scale);
  }
  // 5. 掉落物
  for (var i=0;i<DroppedItems.length;i++){
    var d = DroppedItems[i];
    var sx = (d.x - Camera.x)*scale, sy=(d.y - Camera.y)*scale;
    if (sx<-20||sx>cw+20||sy<-20||sy>ch+20) continue;
    var ic = preRenderItem(d.id);
    var bob = Math.sin(d.t*4)*3;
    g.drawImage(ic, sx-12, sy-12+bob, 24, 24);
  }
  // 6. 生物
  for (var i=0;i<Mobs.length;i++){
    drawMob(Mobs[i], g, scale);
  }
  // 7. 玩家
  drawPlayer(g, scale);
  // 8. 挖掘进度
  if (Player.mineTarget){
    var mt = Player.mineTarget;
    var sx = (mt.x*ts - Camera.x)*scale, sy=(mt.y*ts - Camera.y)*scale;
    g.strokeStyle = 'rgba(255,220,80,0.9)';
    g.lineWidth = 2;
    g.strokeRect(sx+1, sy+1, ts*scale-2, ts*scale-2);
    var p = clamp(Player.mineProgress, 0, 1);
    g.fillStyle = 'rgba(255,140,40,'+(0.3+p*0.4)+')';
    g.fillRect(sx+1, sy+1, (ts*scale-2)*p, ts*scale-2);
  }
  // 9. 鼠标方块高亮
  var mtx = Math.floor(Mouse.wx/ts), mty = Math.floor(Mouse.wy/ts);
  var bid = getBlk(mtx, mty);
  var reach = dist(Player.x/TILE, Player.y/TILE, mtx+0.5, mty+0.5);
  if (mtx>=0 && mty>=0 && mtx<World.W && mty<World.H && reach<REACH){
    var sx = (mtx*ts - Camera.x)*scale, sy=(mty*ts - Camera.y)*scale;
    g.strokeStyle = bid===B.AIR?'rgba(120,220,255,0.7)':'rgba(255,255,255,0.5)';
    g.lineWidth=1;
    g.strokeRect(sx+0.5, sy+0.5, ts*scale-1, ts*scale-1);
  }
  // 10. 小地图
  drawMinimap(g);
}
function blend(a,b,t){return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];}
function blendRgb(a,b,t){var c=blend(a,b,t);return rgb(c);}
function rgb(c){return 'rgb('+clamp(c[0]|0,0,255)+','+clamp(c[1]|0,0,255)+','+clamp(c[2]|0,0,255)+')';}

function drawMob(m, g, scale){
  var sx = (m.x - Camera.x)*scale, sy=(m.y - Camera.y)*scale;
  if (sx<-100||sx>CanvasW+100||sy<-100||sy>CanvasH+100) return;
  var w = m.def.w*scale, h = m.def.h*scale;
  g.save();
  g.translate(sx, sy);
  if (m.hitFlash>0){ g.globalAlpha = 0.6; }
  // 阴影
  g.fillStyle = 'rgba(0,0,0,0.25)';
  g.beginPath(); g.ellipse(0, h/2+2, w/2, h*0.12, 0, 0, 7); g.fill();
  if (m.facing<0){ g.scale(-1,1); }
  // 各生物外观
  if (m.type==='pig'){
    g.fillStyle = m.def.color;
    g.beginPath(); g.ellipse(0, 0, w/2, h/2, 0, 0, 7); g.fill();
    // 头
    g.fillStyle = shade2(m.def.color,0.85);
    g.beginPath(); g.ellipse(w/3, -2, w/4, h/3, 0, 0, 7); g.fill();
    // 鼻
    g.fillStyle = shade2(m.def.color,0.7);
    g.beginPath(); g.ellipse(w/2.6, 0, w/8, h/8, 0, 0, 7); g.fill();
    // 眼
    g.fillStyle='#000'; g.fillRect(w/3-3, -6, 2, 2);
    // 腿
    g.fillStyle = shade2(m.def.color,0.7);
    g.fillRect(-w/3, h/3-2, w/8, h/3);
    g.fillRect(w/4, h/3-2, w/8, h/3);
    // 仙气
    if (Math.sin(m.t*3)>0.7){
      g.fillStyle='rgba(255,220,160,0.5)';
      g.beginPath(); g.arc(-w/3, -h/2, 4, 0, 7); g.fill();
    }
  } else if (m.type==='bird'){
    g.fillStyle = m.def.color;
    g.beginPath(); g.ellipse(0,0, w/2, h/2, 0, 0, 7); g.fill();
    // 翅膀
    g.fillStyle = shade2(m.def.color,0.8);
    var wing = Math.sin(m.t*10)*w/4;
    g.beginPath(); g.ellipse(-w/4, 0, w/3, Math.abs(wing)+2, 0, 0, 7); g.fill();
    // 喙
    g.fillStyle='#ffaa30';
    g.beginPath(); g.moveTo(w/2,0); g.lineTo(w/2+6, -2); g.lineTo(w/2+6, 2); g.closePath(); g.fill();
    g.fillStyle='#000'; g.fillRect(w/3, -3, 2, 2);
  } else if (m.type==='sword'){
    // 飞剑：剑身
    g.fillStyle = m.def.color;
    g.beginPath(); g.moveTo(-w/2,0); g.lineTo(0,-h/2); g.lineTo(w/2,0); g.lineTo(0,h/2); g.closePath(); g.fill();
    g.strokeStyle='#fff'; g.lineWidth=1; g.stroke();
    // 护手
    g.fillStyle='#7a4f1f'; g.fillRect(-2, -h/2, 4, h);
    // 符
    g.fillStyle='#ff3030'; g.fillRect(-2, -h/4, 4, 2);
  } else if (m.type==='carrot'){
    g.fillStyle = m.def.color;
    g.beginPath(); g.moveTo(0,-h/2); g.lineTo(w/2,h/2); g.lineTo(-w/2,h/2); g.closePath(); g.fill();
    g.fillStyle='#3a8a2e';
    for (var i=0;i<3;i++){ g.beginPath(); g.ellipse((i-1)*w/4, -h/2-3, w/6, 3, 0, 0, 7); g.fill(); }
    g.fillStyle='#000'; g.fillRect(-3, 2, 2, 2); g.fillRect(3, 2, 2, 2);
  } else if (m.type==='gourdboy'){
    g.fillStyle = m.def.color;
    g.beginPath(); g.ellipse(0,0, w/2, h/2, 0, 0, 7); g.fill();
    g.fillStyle='#3a8a2e';
    g.beginPath(); g.moveTo(-w/3,-h/2); g.lineTo(0,-h/2-8); g.lineTo(w/3,-h/2); g.closePath(); g.fill();
    g.fillStyle='#fff'; g.font = 'bold '+Math.floor(8*scale)+'px sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('葫', 0, 0);
    // 腿
    g.fillStyle = shade2(m.def.color,0.7);
    g.fillRect(-w/3, h/3, w/6, h/3);
    g.fillRect(w/6, h/3, w/6, h/3);
  } else if (m.type==='golem'){
    g.fillStyle = m.def.color;
    g.fillRect(-w/2, -h/2, w, h);
    g.fillStyle = shade2(m.def.color, 0.8);
    g.fillRect(-w/2, -h/2, w, h*0.3);
    // 眼
    g.fillStyle='#ff8a30';
    g.fillRect(-w/4, -h/3, w/8, h/12);
    g.fillRect(w/8, -h/3, w/8, h/12);
    // 苔藓
    g.fillStyle='#5a7050';
    for (var i=0;i<5;i++){ g.fillRect(-w/2+i*w/5, -h/4, 4, 4); }
  } else if (m.type==='boss'){
    // 天蓬元帅：巨大猪头人
    g.fillStyle = m.def.color;
    // 身体
    g.fillRect(-w/2, -h/2, w, h*0.7);
    // 头
    g.fillStyle = '#ffb0c4';
    g.beginPath(); g.ellipse(0, -h/2+h*0.15, w/2.2, h*0.3, 0, 0, 7); g.fill();
    // 鼻
    g.fillStyle = '#f08098';
    g.beginPath(); g.ellipse(w/4, -h/2+h*0.2, w/8, h/12, 0, 0, 7); g.fill();
    // 眼
    g.fillStyle = '#ff3030';
    g.beginPath(); g.arc(-w/8, -h/2+h*0.1, 5, 0, 7); g.fill();
    g.beginPath(); g.arc(w/6, -h/2+h*0.1, 5, 0, 7); g.fill();
    // 钉耙
    g.strokeStyle='#c0c0c8'; g.lineWidth=3*scale;
    g.beginPath(); g.moveTo(w/2, -h/4); g.lineTo(w/2+30*scale, h/4); g.stroke();
    // 皇冠
    g.fillStyle='#ffd440';
    g.beginPath();
    g.moveTo(-w/3, -h/2);
    g.lineTo(-w/4, -h/2-15*scale);
    g.lineTo(-w/8, -h/2);
    g.lineTo(0, -h/2-20*scale);
    g.lineTo(w/8, -h/2);
    g.lineTo(w/4, -h/2-15*scale);
    g.lineTo(w/3, -h/2);
    g.closePath(); g.fill();
    // 血条
    g.fillStyle='#400'; g.fillRect(-w/2, -h/2-30*scale, w, 8);
    g.fillStyle='#f44'; g.fillRect(-w/2, -h/2-30*scale, w*(m.hp/m.maxHp), 8);
  }
  g.restore();
  g.globalAlpha=1;
  // 名字
  if (m.def.hostile || m.type==='boss' || m.type==='golem'){
    g.fillStyle='rgba(255,255,255,0.9)';
    g.font='bold '+Math.floor(8*scale)+'px sans-serif';
    g.textAlign='center';
    g.fillText(m.def.name, sx, sy-h/2-12*scale);
  }
}
function shade2(hex, s){
  // 简易颜色变暗
  var c = hex.replace('#','');
  if (c.length===3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var r = parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  return 'rgb('+clamp(Math.round(r*s),0,255)+','+clamp(Math.round(g*s),0,255)+','+clamp(Math.round(b*s),0,255)+')';
}
function drawPlayer(g, scale){
  var sx = (Player.x - Camera.x)*scale, sy=(Player.y - Camera.y)*scale;
  g.save();
  g.translate(sx, sy);
  if (Player.invuln>0 && Math.floor(Player.invuln*20)%2===0) g.globalAlpha=0.5;
  if (Player.facing<0){ g.scale(-1,1); }
  var w = TILE*0.6*scale, h = TILE*0.85*scale;
  // 阴影
  g.fillStyle='rgba(0,0,0,0.25)';
  g.beginPath(); g.ellipse(0, h/2+2, w/2, h*0.12, 0, 0, 7); g.fill();
  // 身体
  g.fillStyle='#7a5a3a';
  g.fillRect(-w/3, -h/4, w*2/3, h/2);
  // 头
  g.fillStyle='#ffd0a0';
  g.beginPath(); g.arc(0, -h/4-6, h/4, 0, 7); g.fill();
  // 头发
  g.fillStyle='#3a2a1a';
  g.fillRect(-h/4, -h/4-12, h/2, h/8);
  // 眼
  g.fillStyle='#000'; g.fillRect(2, -h/4-4, 2, 2);
  // 腿
  g.fillStyle='#5a3a1e';
  var leg = Math.sin(Player.t*8)*2;
  if (Math.abs(Player.vx)>0.5){
    g.fillRect(-w/4, h/4, w/4, h/4+leg);
    g.fillRect(w/8, h/4, w/4, h/4-leg);
  } else {
    g.fillRect(-w/4, h/4, w/4, h/4);
    g.fillRect(w/8, h/4, w/4, h/4);
  }
  // 手臂 + 持物
  g.fillStyle='#ffd0a0';
  g.fillRect(w/4, -h/8, w/6, h/3);
  // 持物
  var held = Player.inv[Player.sel];
  if (held){
    var ic = preRenderItem(held.id);
    g.save();
    g.translate(w/3, 0);
    if (Player.swingT>0){
      g.rotate(Math.sin(Player.swingT*15)*0.5);
    }
    g.drawImage(ic, -8*scale, -8*scale, 16*scale, 16*scale);
    g.restore();
  }
  // 玩家光环（持有金丹时）
  if (countItem(Player.inv,'golden_pill')>0){
    g.fillStyle='rgba(255,220,80,0.15)';
    g.beginPath(); g.arc(0,0, w, 0, 7); g.fill();
  }
  g.restore();
  g.globalAlpha=1;
}
function drawMinimap(g){
  var mw = 180, mh = 40;
  var mx = CanvasW - mw - 10, my = 90;
  // 移动设备上缩小并往下放，避免挡住右上任务栏
  if (CanvasW < 600){ mx = CanvasW - mw*0.7 - 6; my = 140; mw = mw*0.7; mh = mh*0.7; }
  // 背景
  g.fillStyle='rgba(0,0,0,0.5)';
  g.fillRect(mx, my, mw, mh);
  // 简化地图
  var step = World.W / mw;
  for (var x=0;x<mw;x++){
    var wx = Math.floor(x*step);
    if (wx>=World.W) break;
    var sy = World.surfaceY[wx];
    var b = getBiome(wx);
    var col = b==='forest'?'#3a8a2e':b==='desert'?'#e0c060':b==='snow'?'#e0e8f0':b==='mush'?'#9050a0':'#888';
    g.fillStyle = col;
    g.fillRect(mx+x, my+mh - (World.H-sy)/World.H*mh, 1, mh);
  }
  // 遗迹标记
  for (var i=0;i<World.structures.length;i++){
    var s=World.structures[i];
    var px = mx + (s.x/World.W)*mw;
    var py = my+mh - (World.H-s.y)/World.H*mh;
    g.fillStyle = s.cleared?'#0f0':'#ff3030';
    g.fillRect(px-2, py-2, 4, 4);
  }
  // 玩家
  g.fillStyle='#fff';
  var px = mx + (Player.x/World.W/TILE)*mw;
  var py = my+mh - (World.H - Player.y/TILE)/World.H*mh;
  g.fillRect(px-2, py-2, 4, 4);
  // BOSS 标记
  if (Player.bossSpawned && !Player.bossDefeated){
    var boss = findMob('boss');
    if (boss){
      var bx = mx + (boss.x/World.W/TILE)*mw;
      var by = my+mh - (World.H-boss.y/TILE)/World.H*mh;
      g.fillStyle='#c8541d';
      g.fillRect(bx-3, by-3, 6, 6);
    }
  }
  // 文字
  g.fillStyle='#fff'; g.font='10px sans-serif';
  g.textAlign='left';
  g.fillText('地图', mx+4, my+10);
}

/* ========== 玩家交互 ========== */
function tickPlayerAction(dt){
  Player.t = (Player.t||0)+dt;
  if (Player.invuln>0) Player.invuln-=dt;
  if (Player.swingT>0) Player.swingT-=dt;
  if (Player.attackCd>0) Player.attackCd-=dt;
  if (Player.placeCd>0) Player.placeCd-=dt;
  if (Player.buffs.heal>0){ Player.buffs.heal-=dt; if (Math.random()<dt*2) healPlayer(2); }

  // 移动输入
  var moveX=0;
  if (Keys['KeyA']||Keys['ArrowLeft']) moveX-=1;
  if (Keys['KeyD']||Keys['ArrowRight']) moveX+=1;
  var running = (Keys['ShiftLeft']||Keys['ShiftRight']) && Player.st>0;
  var speed = running?RUN_V:WALK_V;
  if (Player.inWater) speed *= 0.6;
  Player.vx = lerp(Player.vx, moveX*speed, dt*8);
  if (moveX!==0) Player.facing = moveX>0?1:-1;
  // 物理：重力
  if (!Player.inWater){
    Player.vy += GRAV * dt;
    if (Player.vy > MAX_FALL) Player.vy = MAX_FALL;
  } else {
    Player.vy = lerp(Player.vy, 0, dt*4);
  }
  // 跳跃（只在 onGround 瞬间触发，避免按住连跳）
  if ((Keys['Space']||Keys['KeyW']||Keys['ArrowUp']) && (Player.onGround || Player.inWater)){
    if (Player.inWater){
      Player.vy = -5;
    } else if (Player.onGround){
      Player.vy = -JUMP_V;
      playSound('jump');
    }
    Player.onGround = false;
  }
  // 体力
  if (running && moveX!==0) Player.st -= dt*8;
  else Player.st = clamp(Player.st + dt*4, 0, 100);
  // 饥饿
  Player.hg -= dt*0.4;
  if (Player.hg<=0){ Player.hg=0; if (Math.random()<dt*0.5) damagePlayer(1, '饥饿'); }
  // HP 再生
  if (Player.hg>60 && Player.hp<Player.maxHp && Math.random()<dt*0.5){
    healPlayer(1);
  }
  // 氧气
  if (Player.inWater){
    Player.ox -= dt*100/DROWN_TIME;
    if (Player.ox<=0){ Player.ox=0; if (Math.random()<dt) damagePlayer(3, '溺水'); }
  } else {
    Player.ox = clamp(Player.ox + dt*30, 0, 100);
  }

  // 鼠标动作
  var mtx = Math.floor(Mouse.wx/TILE), mty = Math.floor(Mouse.wy/TILE);
  var reach = dist(Player.x/TILE, Player.y/TILE, mtx+0.5, mty+0.5);
  var inReach = reach<REACH;

  // 挖掘
  if (Mouse.left && inReach && !PanelOpen){
    var bid = getBlk(mtx, mty);
    if (bid!==B.AIR && bid!==B.BED && bid!==B.WATER){
      var bdef = BLK[bid];
      if (!Player.mineTarget || Player.mineTarget.x!==mtx || Player.mineTarget.y!==mty){
        Player.mineTarget = {x:mtx,y:mty};
        Player.mineProgress = 0;
      }
      // 工具倍率
      var mul = 1;
      var held = Player.inv[Player.sel];
      if (held){
        if (held.id==='wpick') mul=1.6;
        else if (held.id==='ipick') mul=3;
        else if (held.id==='dpick') mul=6;
        else if (held.id==='wsword') mul=0.8;
        else if (held.id==='isword') mul=0.8;
        else if (held.id==='dsword') mul=0.8;
      }
      Player.mineProgress += dt * mul / Math.max(0.2, bdef.hard);
      if (Player.mineProgress>=1){
        // 破坏
        var drop = bdef.drop ? bdef.drop : 'b'+bid;
        // 玻璃/冰变没
        if (bid===B.GLASS) drop='b'+B.SAND;
        dropItem(drop, 1, mtx*TILE+TILE/2, mty*TILE+TILE/2);
        setBlk(mtx,mty,B.AIR);
        playSound('mine2');
        // 自动拾取已在 tickDrops
        // 检测金丹座拾取
        if (bid===B.PILBLK){
          var st = findStructureAt(mtx, mty);
          if (st && !st.cleared){
            addItem(Player.inv,'golden_pill',1);
            toast('获得九转金丹 ×1 （'+(Player.pills+1)+'/9）', 2.5);
            playSound('pill');
            st.cleared=true; Player.pills++; Player.clearedRuins++;
            checkBossSpawn();
          }
        }
        Player.mineProgress=0; Player.mineTarget=null;
        recomputeLight();
      }
    } else { Player.mineTarget=null; Player.mineProgress=0; }
  } else { Player.mineTarget=null; Player.mineProgress=0; }

  // 放置
  if (Mouse.right && Player.placeCd<=0 && inReach && !PanelOpen){
    var held = Player.inv[Player.sel];
    if (held && IT[held.id] && IT[held.id].blk!==undefined){
      var blkId = IT[held.id].blk;
      // 不能放在玩家身上
      var ppx = Math.floor(Player.x/TILE), ppy = Math.floor(Player.y/TILE);
      if (!((mtx===ppx||mtx===ppx) && (mty===ppy||mty===ppy-1))){
        if (getBlk(mtx,mty)===B.AIR){
          setBlk(mtx,mty,blkId);
          held.n--;
          if (held.n<=0) Player.inv[Player.sel]=null;
          Player.placeCd=0.18;
          playSound('place');
          recomputeLight();
          updateHotbar();
        }
      }
    } else if (held && held.id==='golden_pill'){
      // 不可放置，提示
    }
  }

  // 攻击（左键 + 剑）
  if (Mouse.left && Player.attackCd<=0 && inReach && !PanelOpen){
    var held = Player.inv[Player.sel];
    var isSword = held && IT[held.id] && IT[held.id].tool==='sword';
    if (isSword){
      Player.swingT = 0.3; Player.attackCd = 0.4;
      // 范围内怪物
      for (var i=0;i<Mobs.length;i++){
        var m = Mobs[i];
        var d = dist(Player.x/TILE, Player.y/TILE, m.x/TILE, m.y/TILE);
        if (d<2.5 && (m.def.hostile || m.type==='pig' || m.type==='bird' || m.type==='carrot')){
          var dmg = IT[held.id].dmg;
          m.hp -= dmg; m.hitFlash=0.15;
          m.vx += Player.facing*3; m.vy -= 2;
          // 仇恨
          if (m.type==='pig' || m.type==='carrot'){ m.hostileAfter=true; }
          Player.attackCd = 0.4;
        }
      }
    }
  }
}
function findStructureAt(x,y){
  for (var i=0;i<World.structures.length;i++){
    var s = World.structures[i];
    if (Math.abs(s.x-x)<8 && Math.abs(s.y-y)<10) return s;
  }
  return null;
}
function findStructure(type){
  for (var i=0;i<World.structures.length;i++) if (World.structures[i].type===type) return World.structures[i];
  return null;
}
function findMob(type){ for (var i=0;i<Mobs.length;i++) if (Mobs[i].type===type) return Mobs[i]; return null; }

function checkBossSpawn(){
  if (Player.pills>=9 && !Player.bossSpawned){
    Player.bossSpawned = true;
    toast('九转金丹齐聚！天蓬元帅降世于世界中央！', 4);
    playSound('boss');
    // 在世界中央地表平台生成 BOSS
    var cx = Math.floor(World.W/2);
    // 平整一块天蓬砖平台
    for (var dx=-8;dx<=8;dx++){
      setBlk(cx+dx, World.surfaceY[cx], B.TIAN);
      // 清空上方 8 格
      for (var dy=1;dy<=8;dy++) setBlk(cx+dx, World.surfaceY[cx]-dy, B.AIR);
    }
    spawnMob('boss', cx*TILE+TILE/2, (World.surfaceY[cx]-4)*TILE);
    // 提示坐标
    setTimeout(function(){ toast('天蓬元帅位于世界中央！击败他即可飞升！', 4); }, 4500);
  }
}

/* ========== HUD/UI 更新 ========== */
function updateHUD(){
